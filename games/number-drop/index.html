<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Number Drop - Fun Learning Game!</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Comic Sans MS',Arial}body{background:linear-gradient(#6EC6FF,#FFF9C4);text-align:center}.ad{background:#fff;border:1px solid #eee;margin:8px auto;padding:8px;max-width:480px;border-radius:10px;font-size:11px;color:#ccc}.card{background:#fff;margin:10px auto;max-width:480px;padding:15px;border-radius:25px;box-shadow:0 10px 25px rgba(0,0,0,.15)}#target{font-size:24px}#target b{font-size:60px;color:#4A90E2;display:block}#stats{font-size:18px;margin:8px 0}#msg{font-size:26px;font-weight:bold;min-height:35px}#gameArea{position:relative;height:440px;overflow:hidden;background:linear-gradient(#fff,#D6F5FF);border-radius:20px;margin:10px}.num{position:absolute;top:-120px;width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:58px;font-weight:bold;cursor:pointer;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.2);border:4px solid #fff}.c1{background:radial-gradient(circle at 30% 30%,#FF9A9A,#FF4757)}.c2{background:radial-gradient(circle at 30% 30%,#FFE29A,#FFA502)}.c3{background:radial-gradient(circle at 30% 30%,#A8E063,#2ED573)}.watermark{background:#FF6B6B;color:#fff;padding:8px;border-radius:20px;font-size:15px;margin-top:8px;display:inline-block}button{border:none;padding:12px 22px;margin:4px;border-radius:20px;font-size:17px;cursor:pointer}#startBtn{background:linear-gradient(#FF6B6B,#FF4757);color:#fff;padding:18px 45px;font-size:26px;border-radius:50px;box-shadow:0 6px 0 #C0392B}.active{background:#4A90E2!important;color:#fff!important}</style></head><body>
<div class="ad" id="ad1">✨ Sponsored ✨</div>
<div class="card"><h1 style="font-size:30px">🌈 NUMBER DROP 🎈</h1><div><button onclick="setMode('numbers')" id="btn-numbers" class="active">🔢 Numbers</button><button onclick="setMode('letters')" id="btn-letters">🔤 Letters</button><button onclick="setMode('colors')" id="btn-colors">🎨 Colors</button></div><div id="target">Find Number <b id="targetNum">?</b></div><div id="stats">⭐ <span id="scoreVal">0</span> | 🏆 Level <span id="levelVal">1</span> | ❤️ <span id="lives">3</span></div><button id="startBtn" onclick="startGame()">▶ PLAY NOW!</button><div id="msg"></div><div id="gameArea"></div><button onclick="toggleSound()">🔊 Sound: <span id="soundState">ON</span></button><div class="watermark">▶ Follow @KidsGamesHub on YouTube ❤️</div></div>
<div class="ad" id="ad2">✨ Sponsored ✨</div>
<div class="card" style="font-size:14px">👨‍👩‍👧 For Parents: Safe for kids 2-6 years | Learn Numbers, Letters & Colors</div>
<div class="ad" id="ad3">✨ Sponsored ✨</div>
<script>
if(location.search.includes('clean')){document.querySelectorAll('.ad').forEach(a=>a.style.display='none')}
let mode='numbers',target='4',score=0,level=1,lives=3,gameOn=false,speed=0.9,soundOn=true;
let colorsList=[{name:'RED',code:'#FF4757'},{name:'BLUE',code:'#0984E3'},{name:'GREEN',code:'#2ED573'},{name:'YELLOW',code:'#FFA502'},{name:'PURPLE',code:'#6C5CE7'}];
let lettersList=['A','B','C','D','E','F','G','H'];
function setMode(m){mode=m;document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+m).classList.add('active');if(gameOn)newRound()}
function speak(t){if(!soundOn)return;try{let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.85;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}}
function playSound(t){if(!soundOn)return;try{let ctx=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);if(t==='correct'){[523,659,784,1046].forEach((f,i)=>{let o2=ctx.createOscillator(),g2=ctx.createGain();o2.connect(g2);g2.connect(ctx.destination);o2.frequency.value=f;g2.gain.value=0.2;o2.start(ctx.currentTime+i*0.12);o2.stop(ctx.currentTime+i*0.12+0.3)})}else{o.frequency.setValueAtTime(220,ctx.currentTime);o.frequency.setValueAtTime(150,ctx.currentTime+0.15);o.start();g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);o.stop(ctx.currentTime+0.5)}}catch(e){}}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundState').innerText=soundOn?'ON':'OFF'}
function newRound(){document.getElementById('gameArea').innerHTML='';let options=[];if(mode==='numbers'){target=String(Math.floor(Math.random()*10));while(options.length<3){let r=String(Math.floor(Math.random()*10));if(!options.includes(r))options.push(r)}if(!options.includes(target))options[0]=target;document.getElementById('target').innerHTML='Find Number <b>'+target+'</b>';speak("Find number "+target)}if(mode==='letters'){target=lettersList[Math.floor(Math.random()*lettersList.length)];options=[target];while(options.length<3){let r=lettersList[Math.floor(Math.random()*lettersList.length)];if(!options.includes(r))options.push(r)}document.getElementById('target').innerHTML='Find Letter <b>'+target+'</b>';speak("Find letter "+target)}if(mode==='colors'){let c=colorsList[Math.floor(Math.random()*colorsList.length)];target=c.name;options=[c];while(options.length<3){let r=colorsList[Math.floor(Math.random()*colorsList.length)];if(!options.includes(r.name))options.push(r)}document.getElementById('target').innerHTML='Find Color <b style="color:'+c.code+'">'+target+'</b>';speak("Find color "+target)}options=options.sort(()=>Math.random()-0.5);options.forEach((item,i)=>{let el=document.createElement('div');el.className='num c'+(i+1);if(mode==='colors'){el.innerText='●';el.style.background=item.code;el.style.fontSize='70px'}else el.innerText=item.name||item;el.style.left=(5+i*30)+'%';el.onclick=()=>checkAnswer(item,el);document.getElementById('gameArea').appendChild(el);fall(el)})}
function fall(el){let top=-120;let id=setInterval(()=>{if(!gameOn){clearInterval(id);return}top+=speed;el.style.top=top+'px';if(top>440){clearInterval(id);el.remove()}},16)}
function checkAnswer(item,el){let isCorrect=mode==='colors'?item.name===target:(item===target||item.name===target);if(isCorrect){playSound('correct');document.getElementById('msg').innerText='🎉 Great Job! Excellent! 👏';document.getElementById('msg').style.color='green';speak("Great Job! Excellent!");score+=10;document.getElementById('scoreVal').innerText=score;if(score%50===0){level++;speed+=0.2;document.getElementById('levelVal').innerText=level;speak("Level Up! Amazing!");document.getElementById('msg').innerText='🏆 LEVEL UP! You are Amazing!'}setTimeout(newRound,1400)}else{playSound('wrong');document.getElementById('msg').innerText='Oops! Try Again 💪';document.getElementById('msg').style.color='red';speak("Oops, try again");lives--;document.getElementById('lives').innerText=lives;if(lives<=0){gameOn=false;document.getElementById('msg').innerText='Game Over! Press PLAY again ❤️';lives=3;document.getElementById('lives').innerText=3;document.getElementById('startBtn').style.display='inline-block'}}}
function startGame(){gameOn=true;score=0;level=1;lives=3;speed=0.9;document.getElementById('scoreVal').innerText='0';document.getElementById('levelVal').innerText='1';document.getElementById('lives').innerText='3';document.getElementById('startBtn').style.display='none';speak("Hello! Let's learn and play!");setTimeout(newRound,800)}
</script>

</body></html>
