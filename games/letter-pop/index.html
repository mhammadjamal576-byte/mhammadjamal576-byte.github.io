<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Letter Pop - Learn A-Z!</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Comic Sans MS',Arial}body{background:linear-gradient(#A29BFE,#74B9FF);text-align:center}.ad{background:#fff;border:2px dashed #bbb;margin:10px auto;padding:10px;max-width:480px;border-radius:12px;font-size:12px;color:#999}.card{background:#fff;margin:10px auto;max-width:480px;padding:15px;border-radius:25px}.ball{width:85px;height:85px;background:#FF6B6B;color:#fff;font-size:45px;font-weight:bold;border-radius:50%;display:inline-block;margin:10px;line-height:85px;cursor:pointer;border:3px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.2)}button{background:#6C5CE7;color:#fff;border:none;padding:15px 35px;font-size:22px;border-radius:50px;cursor:pointer}#msg{font-size:22px;font-weight:bold}</style></head><body>
<div class="ad">AD 1 - TOP<br>Put AdSense here</div>
<div class="card"><h1>🎈 LETTER POP</h1><p>Pop the correct letter!</p><div style="font-size:22px">Find Letter <b id="t" style="font-size:45px;color:#6C5CE7">A</b></div><div>⭐ Score: <span id="s">0</span></div><button onclick="start()">▶ PLAY</button><div id="msg"></div><div id="area"></div></div>
<div class="ad">AD 2 - MIDDLE<br>Put AdSense here</div>
<div class="card">👨‍👩‍👧 For Parents: Learn English A-Z, Safe for kids</div>
<div class="ad">AD 3 - BOTTOM<br>Put AdSense here</div>
<script>let letters=['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O','P'];let target,score=0;function speak(t){try{let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}function start(){score=0;document.getElementById('s').innerText=0;next()}function next(){document.getElementById('area').innerHTML='';target=letters[Math.floor(Math.random()*letters.length)];document.getElementById('t').innerText=target;speak('Find letter '+target);let opts=[target];while(opts.length<3){let r=letters[Math.floor(Math.random()*letters.length)];if(!opts.includes(r))opts.push(r)}opts.sort(()=>Math.random()-.5);opts.forEach(o=>{let d=document.createElement('div');d.className='ball';d.innerText=o;d.onclick=()=>{if(o===target){score+=10;document.getElementById('s').innerText=score;document.getElementById('msg').innerText='🎉 Awesome!';speak('Awesome!');setTimeout(next,1000)}else{document.getElementById('msg').innerText='Oops! Try Again 💪';speak('Oops try again')}};document.getElementById('area').appendChild(d)})}</script></body></html>
