<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Letter Pop - Learn ABC!</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Comic Sans MS',Arial}body{background:linear-gradient(#A29BFE,#DFE6E9);text-align:center}.ad{background:#fff;border:1px solid #eee;margin:8px auto;padding:8px;max-width:480px;border-radius:10px;font-size:11px;color:#ccc}.card{background:#fff;margin:10px auto;max-width:480px;padding:15px;border-radius:25px;box-shadow:0 10px 25px rgba(0,0,0,.15)}#target{font-size:24px}#target b{font-size:60px;color:#6C5CE7;display:block}#stats{font-size:18px;margin:8px 0}#msg{font-size:26px;font-weight:bold;min-height:35px}#gameArea{position:relative;height:440px;overflow:hidden;background:linear-gradient(#fff,#E0E0FF);border-radius:20px;margin:10px}.ball{position:absolute;top:-120px;width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:58px;font-weight:bold;cursor:pointer;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.2);border:4px solid #fff}.c1{background:radial-gradient(circle at 30% 30%,#FF9A9A,#FF4757)}.c2{background:radial-gradient(circle at 30% 30%,#FFE29A,#FFA502)}.c3{background:radial-gradient(circle at 30% 30%,#A8E063,#2ED573)}.watermark{background:#FF6B6B;color:#fff;padding:8px;border-radius:20px;font-size:15px;margin-top:8px;display:inline-block}button{border:none;padding:12px 22px;margin:4px;border-radius:20px;font-size:17px;cursor:pointer}#startBtn{background:linear-gradient(#6C5CE7,#A29BFE);color:#fff;padding:18px 45px;font-size:26px;border-radius:50px;box-shadow:0 6px 0 #4834D4}</style></head><body> <div class="ad">✨ Sponsored ✨</div> <div class="card"><h1 style="font-size:30px">🔤 LETTER POP 🎈</h1><p>Pop the correct letter!</p><div id="target">Find Letter <b id="targetLetter">?</b></div><div id="stats">⭐ <span id="scoreVal">0</span> | ❤️ <span id="lives">3</span></div><button id="startBtn" onclick="startGame()">▶ PLAY NOW!</button><div id="msg"></div><div id="gameArea"></div><button onclick="toggleSound()">🔊 Sound: <span id="soundState">ON</span></button><div class="watermark">▶ Follow @KidsGamesHub on YouTube ❤️</div></div> <div class="ad">✨ Sponsored ✨</div> <div class="card" style="font-size:14px">👨‍👩‍👧 For Parents: Safe for kids 2-6 years | Learn ABC with fun!</div> <div class="ad">✨ Sponsored ✨</div> <script> if(location.search.includes('clean')){document.querySelectorAll('.ad').forEach(a=>a.style.display='none')} let letters=['A','B','C','D','E','F','G','H','I','J','K','L']; let target='A',score=0,lives=3,gameOn=false,soundOn=true,speed=0.9; function speak(t){if(!soundOn)return;try{let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.85;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}} function playSound(t){if(!soundOn)return;try{let ctx=new(window.AudioContext||window.webkitAudioContext)();if(t==='correct'){[523,659,784,1046].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;g.gain.value=0.2;o.start(ctx.currentTime+i*0.12);o.stop(ctx.currentTime+i*0.12+0.3)})}else{let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(220,ctx.currentTime);o.frequency.setValueAtTime(150,ctx.currentTime+0.15);o.start();g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);o.stop(ctx.currentTime+0.5)}}catch(e){}} function toggleSound(){soundOn=!soundOn;document.getElementById('soundState').innerText=soundOn?'ON':'OFF'} function newRound(){document.getElementById('gameArea').innerHTML='';target=letters[Math.floor(Math.random()*letters.length)];document.getElementById('targetLetter').innerText=target;speak("Find letter "+target);let options=[target];while(options.length<3){let r=letters[Math.floor(Math.random()*letters.length)];if(!options.includes(r))options.push(r)}options=options.sort(()=>Math.random()-0.5);options.forEach((item,i)=>{let el=document.createElement('div');el.className='ball c'+(i+1);el.innerText=item;el.style.left=(5+i*30)+'%';el.onclick=()=>checkAnswer(item,el);document.getElementById('gameArea').appendChild(el);fall(el)})} function fall(el){let top=-120;let id=setInterval(()=>{if(!gameOn){clearInterval(id);return}top+=speed;el.style.top=top+'px';if(top>440){clearInterval(id);el.remove()}},16)} function checkAnswer(item,el){if(item===target){playSound('correct');document.getElementById('msg').innerText='🎉 Great Job! Letter '+target+'! 👏';document.getElementById('msg').style.color='green';speak("Great Job! Letter "+target);score+=10;document.getElementById('scoreVal').innerText=score;setTimeout(newRound,1400)}else{playSound('wrong');document.getElementById('msg').innerText='Oops! Try Again 💪';document.getElementById('msg').style.color='red';speak("Oops, try again");lives--;document.getElementById('lives').innerText=lives;if(lives<=0){gameOn=false;document.getElementById('msg').innerText='Game Over! Press PLAY again ❤️';lives=3;document.getElementById('lives').innerText=3;document.getElementById('startBtn').style.display='inline-block'}}} function startGame(){gameOn=true;score=0;lives=3;speed=0.9;document.getElementById('scoreVal').innerText='0';document.getElementById('lives').innerText='3';document.getElementById('startBtn').style.display='none';speak("Hello! Let's learn ABC!");setTimeout(newRound,800)} </script> <!-- Monetag - 1 Code Only - Delayed 40s - Terrific tag --> <script> setTimeout(function(){ var s1=document.createElement('script'); s1.dataset.zone='12207674'; s1.src='https://n6wxm.com/vignette.min.js'; document.body.appendChild(s1); }, 40000); </script> </body></html>
