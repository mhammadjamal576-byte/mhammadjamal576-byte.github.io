<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Color Catch!</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Comic Sans MS',Arial}body{background:linear-gradient(#FFD93D,#FF9A9A);text-align:center}.ad{background:#fff;border:1px solid #eee;margin:8px auto;padding:8px;max-width:480px;border-radius:10px;font-size:11px;color:#ccc}.card{background:#fff;margin:10px auto;max-width:480px;padding:15px;border-radius:25px}.ball{width:115px;height:115px;border-radius:50%;display:inline-block;margin:12px;cursor:pointer;border:5px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.2);font-size:55px;line-height:105px}button{background:#FF6B6B;color:#fff;border:none;padding:18px 40px;font-size:24px;border-radius:50px;cursor:pointer}.watermark{background:#FF6B6B;color:#fff;padding:8px;border-radius:20px;display:inline-block;margin-top:10px}</style></head><body>
<div class="ad">✨ Sponsored ✨</div><div class="card"><h1>🎨 COLOR CATCH</h1><p style="font-size:18px">Tap the correct color!</p><div style="font-size:24px">Find <b id="t" style="font-size:55px">RED</b></div><div style="font-size:20px">⭐ Score: <span id="s">0</span></div><button onclick="start()">▶ PLAY</button><div id="msg" style="font-size:24px;font-weight:bold;min-height:30px"></div><div id="area"></div><div class="watermark">▶ Follow @KidsGamesHub ❤️</div></div><div class="ad">✨ Sponsored ✨</div>
<script>if(location.search.includes('clean')){document.querySelectorAll('.ad').forEach(a=>a.style.display='none')}let colors=[{n:'RED',c:'#FF4757'},{n:'BLUE',c:'#0984E3'},{n:'GREEN',c:'#2ED573'},{n:'YELLOW',c:'#FFA502'},{n:'PURPLE',c:'#6C5CE7'},{n:'PINK',c:'#FD79A8'}];let target,score=0;function speak(t){try{let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}function start(){score=0;document.getElementById('s').innerText=0;next()}function next(){document.getElementById('area').innerHTML='';target=colors[Math.floor(Math.random()*colors.length)];document.getElementById('t').innerText=target.n;document.getElementById('t').style.color=target.c;speak('Find color '+target.n);let opts=[target];while(opts.length<3){let r=colors[Math.floor(Math.random()*colors.length)];if(!opts.includes(r))opts.push(r)}opts.sort(()=>Math.random()-.5);opts.forEach(o=>{let d=document.createElement('div');d.className='ball';d.style.background=o.c;d.innerText='●';d.onclick=()=>{if(o.n===target.n){score+=10;document.getElementById('s').innerText=score;document.getElementById('msg').innerText='🎉 Great Job! 👏';speak('Great Job!');setTimeout(next,1400)}else{document.getElementById('msg').innerText='Oops! Try Again 💪';speak('Oops try again')}};document.getElementById('area').appendChild(d)})}</script></body></html>
