<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Color Catch - Learn Colors!</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Comic Sans MS',Arial}body{background:linear-gradient(#FFD93D,#FF9A9A);text-align:center}.ad{background:#fff;border:2px dashed #bbb;margin:10px auto;padding:10px;max-width:480px;border-radius:12px;font-size:12px;color:#999}.card{background:#fff;margin:10px auto;max-width:480px;padding:15px;border-radius:25px;box-shadow:0 10px 25px rgba(0,0,0,.15)}#target{font-size:22px}#target b{font-size:42px;display:block}.ball{width:90px;height:90px;border-radius:50%;display:inline-block;margin:10px;cursor:pointer;border:4px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.2);font-size:40px;line-height:85px}button{background:#FF6B6B;color:#fff;border:none;padding:15px 35px;font-size:22px;border-radius:50px;cursor:pointer}#msg{font-size:22px;font-weight:bold;min-height:30px}</style></head><body>
<div class="ad">AD 1 - TOP<br>Put AdSense here</div>
<div class="card"><h1>🎨 COLOR CATCH</h1><p>Tap the correct color!</p><div id="target">Find <b id="t">RED</b></div><div>⭐ Score: <span id="s">0</span></div><button onclick="start()">▶ PLAY</button><div id="msg"></div><div id="area"></div></div>
<div class="ad">AD 2 - MIDDLE<br>Put AdSense here</div>
<div class="card">👨‍👩‍👧 For Parents: Safe & Educational for kids 2-6 years</div>
<div class="ad">AD 3 - BOTTOM<br>Put AdSense here</div>
<script>let colors=[{n:'RED',c:'#FF4757'},{n:'BLUE',c:'#0984E3'},{n:'GREEN',c:'#2ED573'},{n:'YELLOW',c:'#FFA502'},{n:'PURPLE',c:'#6C5CE7'},{n:'PINK',c:'#FD79A8'}];let target,score=0,on=false;function speak(t){try{let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}function start(){on=true;score=0;document.getElementById('s').innerText=0;next()}function next(){document.getElementById('area').innerHTML='';target=colors[Math.floor(Math.random()*colors.length)];document.getElementById('t').innerText=target.n;document.getElementById('t').style.color=target.c;speak('Find color '+target.n);let opts=[target];while(opts.length<3){let r=colors[Math.floor(Math.random()*colors.length)];if(!opts.includes(r))opts.push(r)}opts.sort(()=>Math.random()-.5);opts.forEach(o=>{let d=document.createElement('div');d.className='ball';d.style.background=o.c;d.innerText='●';d.onclick=()=>{if(o.n===target.n){score+=10;document.getElementById('s').innerText=score;document.getElementById('msg').innerText='🎉 Great Job!';speak('Great Job!');setTimeout(next,1000)}else{document.getElementById('msg').innerText='Oops! Try Again 💪';speak('Oops try again')}};document.getElementById('area').appendChild(d)})}</script></body></html>
