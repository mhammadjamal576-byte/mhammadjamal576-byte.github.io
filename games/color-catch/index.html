<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Color Catch - Learn Colors!</title> <meta name="description" content="Learn Colors Red Blue Green Yellow with Color Catch! Fun game for kids 2-6. Arabic + English colors!"> <style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Comic Sans MS',Arial}body{background:linear-gradient(#74B9FF,#A29BFE);text-align:center}.ad{background:#fff;border:1px solid #eee;margin:8px auto;padding:8px;max-width:480px;border-radius:10px;font-size:11px;color:#ccc}.card{background:#fff;margin:10px auto;max-width:480px;padding:15px;border-radius:25px;box-shadow:0 10px 25px rgba(0,0,0,.15)}#target{font-size:24px}#target b{font-size:55px;display:block}#stats{font-size:18px;margin:8px 0}#msg{font-size:22px;font-weight:bold;min-height:35px}#gameArea{position:relative;height:440px;overflow:hidden;background:linear-gradient(#fff,#E3F2FD);border-radius:20px;margin:10px}.ball{position:absolute;top:-120px;width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:45px;font-weight:bold;cursor:pointer;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.2);border:4px solid #fff}.watermark{background:#0984E3;color:#fff;padding:8px;border-radius:20px;font-size:15px;margin-top:8px;display:inline-block}button{border:none;padding:12px 22px;margin:4px;border-radius:20px;font-size:17px;cursor:pointer}#startBtn{background:linear-gradient(#0984E3,#74B9FF);color:#fff;padding:18px 45px;font-size:26px;border-radius:50px;box-shadow:0 6px 0 #065A9E}.langBtn{background:#E3F2FD;color:#0984E3;border:2px solid #74B9FF}.more a{background:#2ED573;color:#fff;text-decoration:none;padding:10px 16px;border-radius:18px;font-weight:bold;display:inline-block;margin:4px}</style> </head> <body> <div class="ad">✨ Sponsored ✨</div> <div class="card"><h1 style="font-size:30px">🎨 COLOR CATCH 🌈</h1><p>Catch the correct color!</p> <button class="langBtn" onclick="toggleLang()">🇯🇴 العربية / 🇬🇧 English</button> <div id="target">Find Color <b id="targetLetter">?</b></div> <div id="stats">⭐ <span id="scoreVal">0</span> | ❤️ <span id="lives">5</span> | 🏆 <span id="best">0</span></div> <button id="startBtn" onclick="startGame()">▶ PLAY NOW!</button><div id="msg"></div><div id="gameArea" style="display:none"></div> <button onclick="toggleSound()">🔊 Sound: <span id="soundState">ON</span></button><br> <div class="watermark">▶ Follow @LearnAndPlayKids12345 on YouTube ❤️</div><br> <div class="more"><a href="../../index.html">🏠 Home</a> <a href="../letter-pop/index.html">🔤 Letter Pop</a> <a href="../number-drop/index.html">🔢 Number Drop</a> <a href="../animal-friends/index.html">🦁 Animal Game</a></div> </div> <div class="ad">✨ Sponsored ✨</div> <div class="card" style="font-size:14px">👨‍👩‍👧 For Parents: Safe for kids 2-6 years | Learn Colors in Arabic + English!</div> <div class="ad">✨ Sponsored ✨</div> <script> if(location.search.includes('clean')){document.querySelectorAll('.ad').forEach(a=>a.style.display='none')} let colors=[ {name_en:'Red',name_ar:'أحمر',code:'#FF4757',emoji:'🔴'}, {name_en:'Blue',name_ar:'أزرق',code:'#0984E3',emoji:'🔵'}, {name_en:'Green',name_ar:'أخضر',code:'#2ED573',emoji:'🟢'}, {name_en:'Yellow',name_ar:'أصفر',code:'#FFC312',emoji:'🟡'}, {name_en:'Orange',name_ar:'برتقالي',code:'#FF6B35',emoji:'🟠'}, {name_en:'Purple',name_ar:'بنفسجي',code:'#A55EEA',emoji:'🟣'}, {name_en:'Pink',name_ar:'وردي',code:'#FD79A8',emoji:'🩷'} ]; let cur='en'; let target=null,score=0,lives=5,gameOn=false,soundOn=true,speed=0.9,locked=false,remaining=3; let best=Number(localStorage.getItem('colorCatchBest')||0); document.getElementById('best').innerText=best; function toggleLang(){cur=cur==='en'?'ar':'en'; document.documentElement.dir=cur==='ar'?'rtl':'ltr'; document.getElementById('targetLetter').innerText=cur==='ar'?'؟':'?'; if(gameOn&&!locked) newRound();} function speak(t){if(!soundOn)return;try{let u=new SpeechSynthesisUtterance(t);u.lang=cur==='ar'?'ar-SA':'en-US';u.rate=0.85;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}} function playSound(t){if(!soundOn)return;try{let ctx=new(window.AudioContext||window.webkitAudioContext)();if(t==='correct'){[523,659,784,1046].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;g.gain.value=0.2;o.start(ctx.currentTime+i*0.12);o.stop(ctx.currentTime+i*0.12+0.3)})}else{let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(220,ctx.currentTime);o.frequency.setValueAtTime(150,ctx.currentTime+0.15);o.start();g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);o.stop(ctx.currentTime+0.5)}}catch(e){}} function toggleSound(){soundOn=!soundOn;document.getElementById('soundState').innerText=soundOn?'ON':'OFF'} function newRound(){if(!gameOn)return; locked=false; remaining=3; document.getElementById('gameArea').innerHTML=''; target=colors[Math.floor(Math.random()*colors.length)]; let label=cur==='ar'?target.name_ar:target.name_en; let el=document.getElementById('targetLetter'); el.innerText=target.emoji+' '+label; el.style.color=target.code; speak(cur==='ar'?'ابحث عن اللون '+target.name_ar:"Find color "+target.name_en); let options=[target]; while(options.length<3){let r=colors[Math.floor(Math.random()*colors.length)]; if(!options.includes(r)) options.push(r)} options=options.sort(()=>Math.random()-0.5); options.forEach((item,i)=>{let b=document.createElement('div'); b.className='ball'; b.style.background='radial-gradient(circle at 30% 30%, #ffffff88, '+item.code+')'; b.style.left=(5+i*30)+'%'; b.innerText=item.emoji; b.onclick=()=>checkAnswer(item,b); document.getElementById('gameArea').appendChild(b); fall(b)})} function fall(el){let top=-120; let id=setInterval(()=>{if(!gameOn||locked){clearInterval(id);return} top+=speed; el.style.top=top+'px'; if(top>440){clearInterval(id); if(el.isConnected){el.remove(); remaining--; if(remaining<=0&&!locked){missed()}}}},16)} function missed(){if(!gameOn||locked) return; locked=true; document.getElementById('msg').innerText=cur==='ar'?'انتهى الوقت! حاول مرة أخرى ⏰':'Time is up! Try again ⏰'; loseLife(); if(gameOn) setTimeout(newRound,1300);} function loseLife(){lives--; document.getElementById('lives').innerText=lives; if(lives<=0){gameOn=false; document.getElementById('msg').innerText='Game Over! Press PLAY again ❤️'; document.getElementById('startBtn').style.display='inline-block'; document.getElementById('startBtn').innerText='🔄 PLAY AGAIN';}} function checkAnswer(item,el){if(!gameOn||locked||!el.isConnected) return; if(item===target){locked=true; playSound('correct'); let label=cur==='ar'?target.name_ar:target.name_en; document.getElementById('msg').innerText='🎉 Great Job! '+label+'! 👏'; document.getElementById('msg').style.color='green'; speak(cur==='ar'?'أحسنت! لون '+label:"Great Job! "+label); score+=10; document.getElementById('scoreVal').innerText=score; if(score>best){best=score; localStorage.setItem('colorCatchBest',best); document.getElementById('best').innerText=best;} speed=Math.min(speed+0.08,2.2); setTimeout(newRound,1400)}else{el.remove(); remaining--; playSound('wrong'); document.getElementById('msg').innerText='Oops! Try Again 💪'; document.getElementById('msg').style.color='red'; speak("Oops, try again"); loseLife(); if(gameOn&&remaining<=0){locked=true; setTimeout(newRound,1300)}}} function startGame(){gameOn=true; document.getElementById('gameArea').style.display='block'; score=0; lives=5; speed=0.9; locked=false; document.getElementById('scoreVal').innerText='0'; document.getElementById('lives').innerText='5'; document.getElementById('msg').innerText=''; document.getElementById('startBtn').style.display='none'; speak("Hello! Let's learn Colors!"); setTimeout(newRound,800)} </script> <!-- EVADAV ADS - زون واحد فقط - بعد 60 ثانية - زي فارس --> <script> setTimeout(function() { var s1 = document.createElement('script'); s1.dataset.zone = '12207679'; s1.src = 'https://n6wxm.com/vignette.min.js'; document.body.appendChild(s1); }, 60000); </script> </body> </html>
