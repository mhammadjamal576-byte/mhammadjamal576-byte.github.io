<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>فارس وحبيبته 🏇</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0a1f;color:#fff;font-family:Arial;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;justify-content:space-between;padding:10px 12px;background:#0a0a1f;align-items:center}.logo{font-weight:900;font-size:19px;color:#ffd700}.pill{background:#1a1a2e;padding:8px 12px;border-radius:20px;font-weight:800}
.bar{display:flex;justify-content:space-between;padding:9px 12px;background:#7c2d12;font-weight:900}.bar b{color:#ffd700}
#game{width:100%;flex:1;min-height:380px;display:block;background:#87CEEB}
.hud{display:flex;gap:6px;padding:8px;justify-content:center;background:#0a0a1f}
.card{background:#1a1a2e;padding:7px 11px;border-radius:14px;text-align:center;min-width:80px}.card b{color:#ffd700;display:block}
/* أزرار ثابتة - مستحيل تختفي */
.controls{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#0a0a1f;border-top:3px solid #ffd700;z-index:999;direction:ltr !important}
.btn{width:88px;height:88px;border-radius:50%;border:4px solid #fff;font-size:38px;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #000}
.btn:active{transform:scale(.92)} .left{background:#2563eb;order:1}.right{background:#2563eb;order:4}.jump{background:#f59e0b;width:100px;height:100px;order:2;font-size:44px}.shoot{background:#dc2626;order:3}
.tabs{display:flex;gap:6px;padding:8px 12px;padding-bottom:120px}.tab{flex:1;background:#1a1a2e;padding:11px;border-radius:14px;text-align:center}.tab.on{border:2px solid #ffd700}
.panel{margin:0 12px 12px;background:#111124;padding:12px;border-radius:16px;max-height:12vh;overflow:auto}
.item{display:flex;justify-content:space-between;background:#1e1e35;padding:11px;border-radius:12px;margin:8px 0}.item button{background:#ffd700;border:0;padding:9px 14px;border-radius:20px;font-weight:900}
.big{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#000;padding:24px;border-radius:22px;border:3px solid #ffd700;text-align:center;display:none;z-index:1000;width:90%}
.big button{background:#ffd700;border:0;padding:12px 22px;border-radius:20px;font-weight:900;margin-top:10px;font-size:16px}
.small{position:fixed;top:110px;left:50%;transform:translateX(-50%);background:#00c853;padding:10px 20px;border-radius:20px;font-weight:900;display:none;z-index:1000}
</style></head><body>
<div class="top"><div class="logo">🏇 فارس وحبيبته</div><div class="pill">💰 <span id="coins">0</span></div><button onclick="toggleMusic()" id="musicBtn" style="background:#00c853;border:0;width:52px;height:52px;border-radius:50%;font-size:22px">🎵</button></div>
<div class="bar"><span>المرحلة <b id="level">1</b>/10</span><span>💖 <b id="progTxt">0</b>% وصلت</span><span id="lives">❤️❤️❤️❤️❤️</span></div>
<div class="small" id="small"></div><div class="big" id="big"></div>
<canvas id="game" width="600" height="420"></canvas>
<div class="hud"><div class="card">⭐ نقاط<b id="score">0</b></div><div class="card">🏹 سهام<b id="arrows">99</b></div><div class="card">👾 قتلت<b id="kills">0</b></div></div>
<div style="text-align:center;background:#0a0a1f;padding:6px;font-size:13px;color:#ffd700" id="mission">🏇 اركض يمين ➡️ انط فوق الوحش 🐎 اوصل لحبيبتك 👸</div>
<div class="tabs"><div class="tab on" onclick="showTab('shop',this)">🐎 خيول</div><div class="tab" onclick="showTab('help',this)">❓ كيف تلعب</div></div>
<div class="panel" id="panel"></div>
<!-- الأزرار - ثابتة تحت، دايما مبينة -->
<div class="controls" dir="ltr">
<button class="btn left" id="btnL">◀</button>
<button class="btn jump" id="btnJump">🐎<br></button>
<button class="btn shoot" id="btnShoot">🏹</button>
<button class="btn right" id="btnR">▶</button>
</div>
<script>
let cv=document.getElementById('game'),ctx=cv.getContext('2d');
let W=600,H=420,GROUND=320;
let level=1,score=0,coins=0,lives=5,kills=0,arrows=99;
let playerX=90,playerY=GROUND,vy=0,dir=0,face=1,world=0,levelLen=1600+level*300,lastHit=0,invincible=false,gameOver=false,runSoundTimer=0;
let enemies=[],bullets=[],coinList=[];
let horseEmoji='🐎';
function showSmall(t,c){let m=document.getElementById('small');m.innerText=t;m.style.background=c||'#00c853';m.style.display='block';setTimeout(()=>m.style.display='none',1300)}
function showBig(h){document.getElementById('big').innerHTML=h;document.getElementById('big').style.display='block';gameOver=true}
function hideBig(){document.getElementById('big').style.display='none';gameOver=false}
function makeLevel(){
  world=0;playerY=GROUND;vy=0;enemies=[];bullets=[];coinList=[];
  let n=3+level*2;
  for(let i=0;i<n;i++) enemies.push({wx:500+i*250+Math.random()*150, hp:2, emoji:['👹','👺','👿','🧌'][i%4]});
  for(let i=0;i<8;i++) coinList.push({wx:350+i*200, y:180+Math.random()*90, t:Math.random()*10});
}
function updateHUD(){
  document.getElementById('level').innerText=level;document.getElementById('coins').innerText=coins;document.getElementById('score').innerText=score;document.getElementById('arrows').innerText=arrows;document.getElementById('kills').innerText=kills;
  document.getElementById('lives').innerText='❤️'.repeat(lives)+'🖤'.repeat(5-lives);
  document.getElementById('progTxt').innerText=Math.min(100,Math.floor(world/levelLen*100));
}
// ===== أصوات حقيقية =====
let AC=null,musicOn=false,musicTimer=null;
function ac(){if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();return AC}
function tone(f,d,type='triangle',v=.1){try{let a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.01,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}}
function sGallop(){ // صوت ركض حصان حقيقي - طق طق
  tone(180,.06,'square',.08); setTimeout(()=>tone(150,.06,'square',.08),110); setTimeout(()=>tone(190,.06,'square',.08),220);
}
function sJump(){tone(400,.15,'sine',.13);setTimeout(()=>tone(750,.18,'sine',.11),90)}
function sShoot(){tone(1000,.08,'sine',.11);setTimeout(()=>tone(600,.12,'sine',.09),60)}
function sCoin(){tone(1300,.1,'sine',.12);setTimeout(()=>tone(1650,.16,'sine',.11),70)}
function sHit(){tone(170,.45,'sawtooth',.18);setTimeout(()=>tone(120,.4,'sawtooth',.15),140)}
function sMonster(){tone(90,.35,'sawtooth',.12);setTimeout(()=>tone(70,.3,'sawtooth',.1),120)}
function sWin(){[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,.35,'triangle',.14),i*140))}
function sLose(){[400,250,120].forEach((f,i)=>setTimeout(()=>tone(f,.35,'sawtooth',.13),i*160))}
function sLove(){[880,1100,1320,1560].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sine',.13),i*110))}
let mel=[523,659,784,1046,784,659,587,659],mi=0;
function toggleMusic(){musicOn=!musicOn;document.getElementById('musicBtn').innerText=musicOn?'🔇':'🎵';if(musicOn){ac().resume();musicTimer=setInterval(()=>{tone(mel[mi%mel.length],.28,'triangle',.07);mi++},300)}else clearInterval(musicTimer)}
function jump(){if(playerY>=GROUND-1){vy=-17;sJump();}}
function shoot(){if(arrows<=0){showSmall('خلصت السهام!','#ff4757');return} arrows--; bullets.push({wx:world+playerX+60, y:playerY-25, vx:11}); sShoot();}
let bL=document.getElementById('btnL'),bR=document.getElementById('btnR'),bJ=document.getElementById('btnJump'),bS=document.getElementById('btnShoot');
function hold(btn,d){let s=e=>{e.preventDefault();dir=d;face=d};let e2=e=>{e.preventDefault();dir=0};btn.addEventListener('touchstart',s,{passive:false});btn.addEventListener('touchend',e2);btn.addEventListener('mousedown',s);btn.addEventListener('mouseup',e2);btn.addEventListener('mouseleave',e2)}
hold(bL,-1);hold(bR,1);
bJ.addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});bJ.addEventListener('click',jump);
bS.addEventListener('touchstart',e=>{e.preventDefault();shoot()},{passive:false});bS.addEventListener('click',shoot);
function loop(){
  if(gameOver){requestAnimationFrame(loop);return}
  ctx.clearRect(0,0,W,H);
  // سماء حقيقية
  let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#87CEEB');sky.addColorStop(0.7,'#fde68a');sky.addColorStop(1,'#f59e0b');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // شمس
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(520,60,32,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,215,0,.3)';ctx.beginPath();ctx.arc(520,60,48,0,Math.PI*2);ctx.fill();
  // غيوم
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(130,70,34,14,0,0,Math.PI*2);ctx.ellipse(160,74,24,11,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(380,50,30,12,0,0,Math.PI*2);ctx.fill();
  // قلعة بعيدة
  ctx.fillStyle='#fff';ctx.fillRect(500,180,70,140);ctx.fillStyle='#ef4444';ctx.beginPath();ctx.moveTo(500,180);ctx.lineTo(535,140);ctx.lineTo(570,180);ctx.fill();
  // أرض
  ctx.fillStyle='#4ade80';ctx.fillRect(0,GROUND+30,W,H-GROUND-30);ctx.fillStyle='#8B4513';ctx.fillRect(0,GROUND+30,W,6);
  // خط النهاية
  let finishX=levelLen-world;if(finishX>0&&finishX<600){ctx.fillStyle='#ffd700';ctx.fillRect(finishX-2,GROUND-90,4,120);ctx.fillStyle='#ff6b9d';ctx.beginPath();ctx.moveTo(finishX,GROUND-90);ctx.lineTo(finishX+30,GROUND-75);ctx.lineTo(finishX,GROUND-60);ctx.fill();}
  // عملات
  coinList.forEach(c=>{let x=c.wx-world;if(x<-30||x>630)return;c.t+=.08;ctx.font='34px Arial';ctx.fillText('🪙',x-15,c.y+Math.sin(c.t)*6+15);if(Math.abs(playerX-x)<32&&Math.abs((playerY-10)-c.y)<34){coins++;score+=10;c.wx=world+650+Math.random()*300;c.y=180+Math.random()*90;sCoin();}});
  // وحوش - ايموجي كبير واضح
  enemies.forEach(e=>{
    if(e.wx>world+playerX) e.wx-=0.7+level*0.12; else e.wx+=0.7+level*0.12;
    let x=e.wx-world;if(x<-60||x>660)return;
    ctx.font='52px Arial';ctx.fillText(e.emoji,x-26,GROUND+35);
    ctx.font='12px Arial';ctx.fillText('👾',x-6,GROUND-42);
    if(Math.random()<0.003) sMonster();
    let dx=Math.abs(playerX-x),dy=Math.abs(playerY-GROUND);
    if(!invincible&&Date.now()-lastHit>1000&&dx<32&&dy<34){
      if(playerY<GROUND-60){score+=20;showSmall('🐎 نطيت فوقه! +20');sJump();}
      else{lives--;lastHit=Date.now();sHit();if(navigator.vibrate)navigator.vibrate(200);showSmall('😱 مسكك! بقي '+lives+' قلوب','#ff4757');
        if(lives<=0){sLose();showBig(`<h2>💔 الوحوش منعوك!</h2><p>خلصت الـ 5 قلوب</p><button onclick="restartAll()">🔄 ابدأ من المرحلة 1</button>`);}
        else{invincible=true;setTimeout(()=>invincible=false,1500);}
      }
    }
  });
  // سهام
  bullets.forEach((b,i)=>{b.wx+=b.vx;let x=b.wx-world;if(x<-20||x>620){bullets.splice(i,1);return}ctx.font='28px Arial';ctx.fillText('➡️',x,b.y+10);
    let hit=false;enemies.forEach(en=>{if(Math.abs(b.wx-en.wx)<36&&Math.abs(b.y-(GROUND-5))<34){en.hp--;hit=true;if(en.hp<=0){score+=30;coins+=2;kills++;en.wx=world+650+Math.random()*250;en.hp=2;showSmall('🏹 صبته! +30');}}});if(hit)bullets.splice(i,1);});
  // حبيبتك - أميرة حقيقية كبيرة
  let px2=levelLen-world;
  if(px2>-60&&px2<660){
    ctx.font='72px Arial';ctx.fillText('👸',px2-36,GROUND+38);
    ctx.font='bold 14px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('حبيبتك 💖',px2,GROUND+58);
    ctx.font=(22+Math.sin(Date.now()/300)*4)+'px Arial';ctx.fillText('💖',px2-10,GROUND-58);
    ctx.fillStyle='#ff6b9d';ctx.font='bold 13px Arial';ctx.fillText('ساعدني! 💖',px2,GROUND-75);
  }
  // الفارس على حصان - كبير وواضح 🏇
  ctx.save();ctx.translate(playerX,GROUND);if(face==-1)ctx.scale(-1,1);if(invincible&&Math.floor(Date.now()/180)%2==0)ctx.globalAlpha=.5;
  ctx.font='64px Arial';ctx.fillText('🏇',-32,30);
  // اسم فوق الفارس
  ctx.font='bold 12px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('الفارس',0,-42);
  ctx.restore();
  // حركة + صوت ركض
  if(dir!=0){world+=dir*4.5;if(world<0)world=0;runSoundTimer++;if(runSoundTimer>12){runSoundTimer=0;sGallop();}}
  vy+=0.85;playerY+=vy;if(playerY>GROUND){playerY=GROUND;vy=0;}
  if(world>=levelLen-90){
    sWin();sLove();
    if(level>=10){showBig(`<h2>👑 خلصت كل الـ 10 مراحل!</h2><p style="font-size:50px">🏇💖👸</p><p>الفارس وصل لحبيبته!</p><p>⭐ ${score} | 💰 ${coins}</p><button onclick="restartAll()">🔄 العب من جديد</button>`);}
    else{showBig(`<h2>💖 وصلت لحبيبتك!</h2><p style="font-size:50px">🏇💖👸</p><p>المرحلة ${level} خلصت! +100</p><button onclick="nextLevel()">➡️ المرحلة ${level+1}</button>`);}
    world=levelLen-90;
  }
  updateHUD();requestAnimationFrame(loop);
}
function nextLevel(){hideBig();level++;score+=100;coins+=50;arrows+=20;levelLen=1600+level*300;makeLevel();}
function restartAll(){hideBig();level=1;score=0;coins=0;lives=5;kills=0;arrows=99;levelLen=1900;makeLevel();}
function showTab(t,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');let p=document.getElementById('panel');
if(t=='shop')p.innerHTML=`<h3>🐎 اختر حصانك</h3><div class="item"><span>🐎 حصان بني</span><button onclick="setHorse('🐎')">اختر</button></div><div class="item"><span>🦄 يونيكورن</span><button onclick="setHorse('🦄')">اختر</button></div><div class="item"><span>🏹 20 سهم - 30 🪙</span><button onclick="buyArrows()">اشتري</button></div>`;
if(t=='help')p.innerHTML=`<h3>❓ كيف تلعب؟</h3><p>▶ امشي يمين - ◀ ارجع<br>🐎 زر الحصان = نط<br>🏹 زر السهم = اضرب<br>💖 اوصل للأميرة 👸<br>❤️ معك 5 قلوب بس!</p>`;}
function setHorse(e){horseEmoji=e;showSmall('تم! حصانك الجديد '+e)}
function buyArrows(){if(coins>=30){coins-=30;arrows+=20;showSmall('تم! +20 سهم 🏹')}else showSmall('ما معك عملات!','#ff4757')}
makeLevel();showTab('shop',document.querySelector('.tab'));loop();
</script></body></html>
