<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>فارس وحبيبته 🏇</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#87CEEB;color:#fff;font-family:Arial;overflow:hidden;height:100dvh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;padding:10px 12px;background:#0a0a1f}.logo{font-weight:900;font-size:19px;color:#ffd700}.pill{background:#1a1a2e;padding:7px 11px;border-radius:20px;font-weight:800}
.bar{display:flex;justify-content:space-between;padding:9px 12px;background:#1a0a3e;font-weight:900}.bar b{color:#ffd700}
canvas{width:100%;flex:1;min-height:400px;display:block;background:#87CEEB}
.hud{display:flex;gap:6px;padding:8px;justify-content:center;background:#0a0a1f;flex-wrap:wrap}
.card{background:#1a1a2e;padding:7px 11px;border-radius:14px;text-align:center;min-width:78px}.card b{color:#ffd700;display:block}
.controls{display:flex;justify-content:space-between;padding:16px 18px calc(16px + env(safe-area-inset-bottom));background:#0a0a1f;direction:ltr !important}
.btn{width:84px;height:84px;border-radius:50%;border:3px solid #fff;font-size:34px;color:#fff;display:flex;align-items:center;justify-content:center}
.btn:active{transform:scale(.92)} .left{background:#2563eb;order:1}.right{background:#2563eb;order:4}.jump{background:#f59e0b;width:96px;height:96px;order:2}.shoot{background:#dc2626;order:3}.musicBtn{background:#00c853;width:52px;height:52px;font-size:20px}
.tabs{display:flex;gap:6px;padding:8px 12px}.tab{flex:1;background:#1a1a2e;padding:11px;border-radius:14px;text-align:center}.tab.on{border:2px solid #ffd700;background:#2a1a3e}
.panel{margin:0 12px 12px;background:#111124;padding:12px;border-radius:16px;max-height:14vh;overflow:auto}
.item{display:flex;justify-content:space-between;background:#1e1e35;padding:11px;border-radius:12px;margin:8px 0}.item button{background:#ffd700;border:0;padding:9px 14px;border-radius:20px;font-weight:900}
.big{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#000;padding:24px;border-radius:22px;border:3px solid #ffd700;text-align:center;display:none;z-index:50;width:90%}
.big button{background:#ffd700;border:0;padding:12px 22px;border-radius:20px;font-weight:900;margin-top:10px;font-size:16px}
.small{position:fixed;top:110px;left:50%;transform:translateX(-50%);background:#00c853;padding:10px 20px;border-radius:20px;font-weight:900;display:none;z-index:40}
.progress{height:10px;background:#333;margin:0 12px;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#ffd700;width:0%}
</style></head><body>
<div class="top"><div class="logo">🏇 فارس وحبيبته</div><div class="pill">💰 <span id="coins">0</span></div><button class="musicBtn btn" id="musicBtn" onclick="toggleMusic()">🎵</button></div>
<div class="bar"><span>المرحلة <b id="level">1</b>/10</span><span>💖 <b id="dist">0</b>% وصلت</span><span id="lives">❤️❤️❤️❤️❤️</span></div>
<div class="small" id="small"></div><div class="big" id="big"></div>
<canvas id="game" width="600" height="420"></canvas>
<div class="hud"><div class="card">⭐ نقاط<b id="score">0</b></div><div class="card">🏹 سهام<b id="arrows">99</b></div><div class="card">👾 قتلت<b id="kills">0</b></div></div>
<div class="progress"><div id="prog"></div></div>
<div style="text-align:center;background:#0a0a1f;padding:6px;font-size:13px;color:#ffd700" id="mission">🏇 اركض يمين، انط فوق الوحوش، اوصل لحبيبتك!</div>
<div class="controls" dir="ltr"><button class="btn left" id="btnL">◀</button><button class="btn jump" id="btnJump">🐎</button><button class="btn shoot" id="btnShoot">🏹</button><button class="btn right" id="btnR">▶</button></div>
<div class="tabs"><div class="tab on" onclick="showTab('shop',this)">🐎 خيول</div><div class="tab" onclick="showTab('help',this)">❓ كيف تلعب</div></div>
<div class="panel" id="panel"></div>
<script>
let cv=document.getElementById('game'),ctx=cv.getContext('2d');
let W=600,H=420,GROUND=330;
let level=1,score=0,coins=0,lives=5,kills=0,arrows=99;
let playerX=80,playerY=GROUND,vy=0,dir=0,face=1,world=0,levelLen=1800+level*300,lastHit=0,invincible=false,gameOver=false;
let enemies=[],bullets=[],coinList=[],particles=[];
let horse='brown';
function showSmall(t,c){let m=document.getElementById('small');m.innerText=t;m.style.background=c||'#00c853';m.style.display='block';setTimeout(()=>m.style.display='none',1300)}
function showBig(h){document.getElementById('big').innerHTML=h;document.getElementById('big').style.display='block';gameOver=true}
function hideBig(){document.getElementById('big').style.display='none';gameOver=false}
function makeLevel(){
  world=0;playerY=GROUND;vy=0;enemies=[];bullets=[];coinList=[];
  let n=3+level*2;
  for(let i=0;i<n;i++) enemies.push({wx:500+i*260+Math.random()*150, hp:2, color:['#ff2d55','#7d00ff','#ff9500','#00c853'][i%4], phase:Math.random()*10});
  for(let i=0;i<8;i++) coinList.push({wx:350+i*220, y:190+Math.random()*90, t:Math.random()*10});
  document.getElementById('mission').innerText='🏇 المرحلة '+level+' - اوصل لحبيبتك! الوحوش بتلاحقك!';
}
function updateHUD(){
  document.getElementById('level').innerText=level;document.getElementById('coins').innerText=coins;document.getElementById('score').innerText=score;document.getElementById('arrows').innerText=arrows;document.getElementById('kills').innerText=kills;
  document.getElementById('lives').innerText='❤️'.repeat(lives)+'🖤'.repeat(5-lives);
  let p=Math.min(100,Math.floor(world/levelLen*100));document.getElementById('dist').innerText=p;document.getElementById('prog').style.width=p+'%';
}
// أصوات بسيطة ونظيفة
let AC=null, musicOn=false, musicTimer=null;
function ac(){if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();return AC}
function tone(f,d,type='triangle',v=.1){try{let a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.01,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}}
function sJump(){tone(400,.15,'sine',.12);setTimeout(()=>tone(700,.15,'sine',.1),80)}
function sShoot(){tone(900,.1,'sine',.1)}
function sCoin(){tone(1300,.1,'sine',.1);setTimeout(()=>tone(1600,.15,'sine',.1),70)}
function sHit(){tone(180,.4,'sawtooth',.15)}
function sWin(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.13),i*130))}
function sLose(){[400,250,120].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sawtooth',.12),i*150))}
let mel=[523,659,784,1046,784,659,587,659],mi=0;
function toggleMusic(){musicOn=!musicOn;document.getElementById('musicBtn').innerText=musicOn?'🔇':'🎵';if(musicOn){ac().resume();musicTimer=setInterval(()=>{tone(mel[mi%mel.length],.28,'triangle',.07);mi++},300)}else clearInterval(musicTimer)}
function jump(){if(playerY>=GROUND-1){vy=-17;sJump();}}
function shoot(){if(arrows<=0){showSmall('خلصت السهام!','#ff4757');return} arrows--; bullets.push({wx:world+playerX+50, y:playerY-20, vx:10}); sShoot();}
let bL=document.getElementById('btnL'),bR=document.getElementById('btnR'),bJ=document.getElementById('btnJump'),bS=document.getElementById('btnShoot');
function hold(btn,d){let s=e=>{e.preventDefault();dir=d;face=d};let e2=e=>{e.preventDefault();dir=0};btn.addEventListener('touchstart',s,{passive:false});btn.addEventListener('touchend',e2);btn.addEventListener('mousedown',s);btn.addEventListener('mouseup',e2)}
hold(bL,-1);hold(bR,1);
bJ.addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});bJ.addEventListener('click',jump);
bS.addEventListener('touchstart',e=>{e.preventDefault();shoot()},{passive:false});bS.addEventListener('click',shoot);
function drawHorse(){
  ctx.save();ctx.translate(playerX,playerY);if(face==-1)ctx.scale(-1,1);if(invincible&&Math.floor(Date.now()/180)%2==0)ctx.globalAlpha=.5;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.ellipse(0,32,30,6,0,0,Math.PI*2);ctx.fill();
  let hc=horse=='brown'?'#8B4513':horse=='white'?'#eee':'#222';
  let run=dir!=0?Math.sin(Date.now()/90)*7:0;
  ctx.strokeStyle=hc;ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(-16+run,28);ctx.stroke();
  ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(16-run,28);ctx.stroke();
  ctx.fillStyle=hc;ctx.beginPath();ctx.ellipse(0,0,34,15,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(30,-14,9,16,-.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(38,-26,15,7,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(42,-28,2.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=hc;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-32,0);ctx.quadraticCurveTo(-46,12,-40,26);ctx.stroke();
  // الفارس
  ctx.fillStyle='#1e3a8a';ctx.fillRect(-8,-40,18,20);
  ctx.fillStyle='#ffd700';ctx.fillRect(-8,-40,18,4);
  ctx.fillStyle='#ffdbac';ctx.beginPath();ctx.arc(1,-48,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c0c0c0';ctx.beginPath();ctx.arc(1,-50,11,Math.PI,0);ctx.fill();
  ctx.fillStyle='#ef4444';ctx.beginPath();ctx.moveTo(1,-60);ctx.lineTo(5,-50);ctx.lineTo(-3,-50);ctx.fill();
  ctx.restore();
}
function drawMonster(e){
  let x=e.wx-world;if(x<-60||x>660)return;
  ctx.save();ctx.translate(x,GROUND);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.ellipse(0,32,22,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-16,-16);ctx.lineTo(-9,-36);ctx.lineTo(-2,-16);ctx.fill();ctx.beginPath();ctx.moveTo(16,-16);ctx.lineTo(9,-36);ctx.lineTo(2,-16);ctx.fill();
  ctx.fillStyle=e.color;ctx.beginPath();ctx.ellipse(0,0,24,26,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-9,-5,7,0,Math.PI*2);ctx.arc(9,-5,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-9,-5,3,0,Math.PI*2);ctx.arc(9,-5,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3a0000';ctx.beginPath();ctx.ellipse(0,12,12,7,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(-9,8,5,4);ctx.fillRect(4,8,5,4);
  ctx.restore();
}
function drawPrincess(){
  let x=levelLen-world;if(x<-60||x>660)return;
  ctx.save();ctx.translate(x,GROUND);
  ctx.fillStyle='#ff6b9d';ctx.beginPath();ctx.moveTo(0,-52);ctx.lineTo(-20,28);ctx.lineTo(20,28);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffdbac';ctx.beginPath();ctx.arc(0,-56,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5b21b6';ctx.beginPath();ctx.arc(0,-60,12,Math.PI,0);ctx.fill();
  ctx.fillStyle='#ffd700';ctx.fillRect(-8,-72,16,7);
  let s=1+Math.sin(Date.now()/300)*.2;ctx.font=(20*s)+'px Arial';ctx.fillText('💖',-10,-82);
  ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('حبيبتك',0,46);
  ctx.restore();
}
function loop(){
  if(gameOver){requestAnimationFrame(loop);return}
  ctx.clearRect(0,0,W,H);
  // سماء + أرض بسيطة
  let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#87CEEB');sky.addColorStop(1,'#fde68a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#4ade80';ctx.fillRect(0,GROUND+30,W,H-GROUND-30);
  ctx.fillStyle='#8B4513';ctx.fillRect(0,GROUND+30,W,5);
  // غيوم
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.ellipse(120,60,30,12,0,0,Math.PI*2);ctx.ellipse(150,64,22,10,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(420,40,30,12,0,0,Math.PI*2);ctx.fill();
  // عملات
  coinList.forEach(c=>{let x=c.wx-world;if(x<-30||x>630)return;c.t+=.08;ctx.save();ctx.translate(x,c.y+Math.sin(c.t)*6);ctx.fillStyle='#ffd700';ctx.beginPath();ctx.ellipse(0,0,14,16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.ellipse(0,0,9,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText('N',0,5);ctx.restore();
    if(Math.abs(playerX-x)<30&&Math.abs((playerY-10)-c.y)<32){coins++;score+=10;c.wx=world+650+Math.random()*300;c.y=190+Math.random()*90;sCoin();}});
  // وحوش - تلاحق ببطء
  enemies.forEach(e=>{
    if(e.wx>world+playerX) e.wx-=0.6+level*0.15; else e.wx+=0.6+level*0.15;
    drawMonster(e);
    let x=e.wx-world, dx=Math.abs(playerX-x), dy=Math.abs(playerY-GROUND);
    if(!invincible&&Date.now()-lastHit>1000&&dx<30&&dy<32){
      if(playerY<GROUND-60){score+=20;showSmall('🐎 نطيت فوقه! +20');sJump();}
      else{lives--;lastHit=Date.now();sHit();if(navigator.vibrate)navigator.vibrate(150);showSmall('😱 مسكك! بقي '+lives+' قلوب','#ff4757');
        if(lives<=0){sLose();showBig(`<h2>💔 الوحوش منعوك!</h2><p>خلصت الـ 5 قلوب</p><button onclick="restartAll()">🔄 ابدأ من المرحلة 1</button>`);}
        else{invincible=true;setTimeout(()=>invincible=false,1500);}
      }
    }
  });
  // سهام - تتحرك في العالم
  bullets.forEach((b,i)=>{
    b.wx+=b.vx;let x=b.wx-world;if(x<-20||x>620){bullets.splice(i,1);return}
    ctx.fillStyle='#8B4513';ctx.fillRect(x,b.y,18,3);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x+18,b.y+1);ctx.lineTo(x+26,b.y-4);ctx.lineTo(x+26,b.y+6);ctx.fill();
    let hit=false;enemies.forEach(en=>{let ex=en.wx-world;if(Math.abs(b.wx-en.wx)<34&&Math.abs(b.y-(GROUND-5))<32){en.hp--;hit=true;if(en.hp<=0){score+=30;coins+=2;kills++;en.wx=world+650+Math.random()*250;en.hp=2;showSmall('🏹 صبته! +30');}}});
    if(hit)bullets.splice(i,1);
  });
  particles.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1)});
  // حركة
  if(dir!=0){world+=dir*4;if(world<0)world=0;}
  vy+=0.85;playerY+=vy;if(playerY>GROUND){playerY=GROUND;vy=0;}
  drawPrincess();
  if(world>=levelLen-90){
    sWin();
    if(level>=10){showBig(`<h2>👑 خلصت كل الـ 10 مراحل!</h2><p>💖 الفارس وصل لحبيبته!</p><p>⭐ ${score} | 💰 ${coins}</p><button onclick="restartAll()">🔄 العب من جديد</button>`);}
    else{showBig(`<h2>💖 وصلت لحبيبتك!</h2><p>المرحلة ${level} خلصت! +100 نقطة</p><button onclick="nextLevel()">➡️ المرحلة ${level+1}</button>`);}
    world=levelLen-90;
  }
  drawHorse();
  updateHUD();requestAnimationFrame(loop);
}
function nextLevel(){hideBig();level++;score+=100;coins+=50;arrows+=20;levelLen=1800+level*300;makeLevel();}
function restartAll(){hideBig();level=1;score=0;coins=0;lives=5;kills=0;arrows=99;levelLen=2100;makeLevel();}
function showTab(t,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');let p=document.getElementById('panel');
if(t=='shop')p.innerHTML=`<h3>🐎 اختر حصانك</h3><div class="item"><span>🐎 بني</span><button onclick="setHorse('brown')">اختر</button></div><div class="item"><span>🐎 أبيض</span><button onclick="setHorse('white')">اختر</button></div><div class="item"><span>🐎 أسود</span><button onclick="setHorse('black')">اختر</button></div><div class="item"><span>🏹 20 سهم - 30 🪙</span><button onclick="buyArrows()">اشتري</button></div>`;
if(t=='help')p.innerHTML=`<h3>❓ كيف تلعب؟</h3><p>▶ امشي يمين - ◀ ارجع<br>🐎 انط فوق الوحش<br>🏹 اضرب الوحش بالسهم<br>💖 اوصل للأميرة بآخر المرحلة<br>❤️ معك 5 قلوب بس!</p>`;}
function setHorse(c){horse=c;showSmall('تم! حصانك الجديد 🐎')}
function buyArrows(){if(coins>=30){coins-=30;arrows+=20;showSmall('تم! +20 سهم 🏹')}else showSmall('ما معك عملات!','#ff4757')}
makeLevel();showTab('shop',document.querySelector('.tab'));loop();
</script></body></html>
