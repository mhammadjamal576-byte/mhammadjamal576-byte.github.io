<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لعبة الفارس | العب وتعلم</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(180deg,#1a2a6c,#b21f1f,#fdbb2d);min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
.top{width:100%;max-width:480px;padding:12px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.top h1{font-size:20px}
.score-box{background:rgba(255,255,255,.25);padding:6px 14px;border-radius:20px;font-weight:bold}
.game-area{width:100%;max-width:480px;height:420px;background:#87CEEB;position:relative;overflow:hidden;border-radius:20px;border:4px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.3);margin:0 10px}
.ground{position:absolute;bottom:0;left:0;width:100%;height:60px;background:#8B4513;border-top:6px solid #228B22}
.knight{position:absolute;bottom:60px;left:30px;width:70px;height:90px;font-size:70px;line-height:90px;text-align:center;transition:bottom .35s;z-index:10}
.knight.jump{bottom:180px}
.star{position:absolute;width:50px;height:50px;font-size:42px;line-height:50px;text-align:center;animation:fall linear forwards}
@keyframes fall{from{top:-60px}to{top:360px}}
.enemy{position:absolute;width:55px;height:55px;font-size:48px;line-height:55px;text-align:center;animation:fall linear forwards}
.controls{width:100%;max-width:480px;display:flex;gap:10px;padding:14px}
.btn{flex:1;padding:16px;border:none;border-radius:16px;font-size:20px;font-weight:bold;cursor:pointer;color:#fff}
.btn-jump{background:#FF9800}
.btn-left{background:#2196F3}
.btn-right{background:#4CAF50}
.btn:active{transform:scale(.95)}
.start-screen{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:20;text-align:center;padding:20px}
.start-screen h2{font-size:28px;margin-bottom:10px}
.start-screen p{font-size:16px;margin-bottom:18px;line-height:1.6}
.start-btn{background:#FFD700;color:#333;border:none;padding:14px 30px;border-radius:30px;font-size:20px;font-weight:bold;cursor:pointer}
.info{text-align:center;color:#fff;padding:8px;font-size:14px;line-height:1.6}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="top">
<h1>🏇 لعبة الفارس</h1>
<div class="score-box">⭐ النقاط: <span id="score">0</span></div>
</div>

<div class="game-area" id="gameArea">
<div class="ground"></div>
<div class="knight" id="knight">🏇</div>

<div class="start-screen" id="startScreen">
<h2>أهلاً يا بطل! 🏇</h2>
<p>اجمع النجوم ⭐<br>وتجنب الصخور 🪨<br>العب أول دقيقة بدون إعلانات</p>
<button class="start-btn" onclick="startGame()">ابدأ اللعب ▶️</button>
</div>
</div>

<div class="controls">
<button class="btn btn-left" onclick="moveLeft()">◀ يسار</button>
<button class="btn btn-jump" onclick="jump()">⬆ اقفز</button>
<button class="btn btn-right" onclick="moveRight()">يمين ▶</button>
</div>

<p class="info">العب واجمع أكبر عدد من النجوم<br>لعبة آمنة للأطفال</p>

<script>
let score = 0;
let playing = false;
let knightPos = 30;
let gameInterval;

const knight = document.getElementById('knight');
const gameArea = document.getElementById('gameArea');

function startGame(){
    document.getElementById('startScreen').classList.add('hidden');
    score = 0;
    document.getElementById('score').textContent = score;
    knightPos = 30;
    knight.style.left = knightPos + 'px';
    playing = true;
    gameInterval = setInterval(spawnItem, 900);
}

function jump(){
    if(!playing) return;
    knight.classList.add('jump');
    setTimeout(()=>{ knight.classList.remove('jump'); }, 400);
}

function moveLeft(){
    if(!playing) return;
    knightPos = Math.max(0, knightPos - 40);
    knight.style.left = knightPos + 'px';
}
function moveRight(){
    if(!playing) return;
    knightPos = Math.min(380, knightPos + 40);
    knight.style.left = knightPos + 'px';
}

function spawnItem(){
    if(!playing) return;
    let isStar = Math.random() > 0.4;
    let el = document.createElement('div');
    el.className = isStar ? 'star' : 'enemy';
    el.textContent = isStar ? '⭐' : '🪨';
    el.style.left = Math.floor(Math.random()*380) + 'px';
    el.style.animationDuration = '2.5s';
    gameArea.appendChild(el);

    let check = setInterval(()=>{
        let elTop = el.offsetTop;
        let elLeft = el.offsetLeft;
        let knightTop = knight.offsetTop;
        // التقاط
        if(elTop > 300 && elTop < 380 && Math.abs(elLeft - knightPos) < 50){
            if(isStar){
                score += 10;
                document.getElementById('score').textContent = score;
                el.remove();
                clearInterval(check);
            } else {
                // خسرت
                playing = false;
                clearInterval(gameInterval);
                clearInterval(check);
                el.remove();
                alert('انتهت اللعبة! نقاطك: ' + score + ' ⭐\nأحسنت يا بطل!');
                location.reload();
            }
        }
        if(elTop >= 360){
            el.remove();
            clearInterval(check);
        }
    }, 50);
}

// لوحة المفاتيح للكمبيوتر
document.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowLeft') moveLeft();
    if(e.key === 'ArrowRight') moveRight();
    if(e.key === ' ' || e.key === 'ArrowUp') jump();
});
</script>

</body>
</html>
