<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>فارس وحبيبته 2026</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0a1f;color:#fff;font-family:Arial;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;padding:10px;background:#0a0a1f}.logo{font-weight:900;color:#ffd700}.pill{background:#1a1a2e;padding:8px 12px;border-radius:20px}
.bar{display:flex;justify-content:space-between;padding:9px 12px;background:#7c2d12;font-weight:900}
#world{position:relative;flex:1;overflow:hidden;background:linear-gradient(#87CEEB 0%,#fde68a 70%,#4ade80 70%,#4ade80 100%);min-height:380px}
.cloud{position:absolute;background:#fff;border-radius:50%;opacity:.9}
.sun{position:absolute;top:18px;right:20px;width:52px;height:52px;background:#ffd700;border-radius:50%;box-shadow:0 0 30px #ffd700}
.ground{position:absolute;bottom:0;left:0;right:0;height:70px;background:#4ade80;border-top:6px solid #8B4513}
.castle{position:absolute;bottom:68px;width:90px;height:130px;background:#fff;border-radius:10px 10px 0 0;text-align:center;font-size:11px;color:#333;padding-top:10px}
.castle::before{content:'';position:absolute;top:-28px;left:15px;border-left:30px solid transparent;border-right:30px solid transparent;border-bottom:30px solid #ef4444}
#knight{position:absolute;bottom:68px;left:20px;width:90px;height:90px;font-size:68px;z-index:10;transition:bottom .18s;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
#knight.run{animation:gallop .32s infinite}
@keyframes gallop{0%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}100%{transform:translateY(0) rotate(-2deg)}}
#knight.jump{animation:jumpAnim .6s}
@keyframes jumpAnim{0%{transform:translateY(0)}50%{transform:translateY(-110px) scale(1.05)}100%{transform:translateY(0)}}
#princess{position:absolute;bottom:68px;width:80px;height:110px;font-size:64px;text-align:center;z-index:5}
#princess .name{background:#ff6b9d;color:#fff;font-size:12px;border-radius:20px;padding:3px 8px;display:inline-block}
#princess .heart{font-size:22px;animation:heartBeat 1s infinite;display:block}
@keyframes heartBeat{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
.monster{position:absolute;bottom:68px;width:62px;height:62px;font-size:52px;z-index:6;animation:monsterWalk .4s infinite}
@keyframes monsterWalk{0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.coin{position:absolute;width:34px;height:36px;background:radial-gradient(#fff176,#ffd700,#ffaa00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:16px;box-shadow:0 0 14px #ffd700;z-index:4}
.arrow{position:absolute;height:5px;background:#8B4513;border-radius:3px;z-index:20}
.arrow::after{content:'';position:absolute;right:-10px;top:-5px;border-left:12px solid #ccc;border-top:7px solid transparent;border-bottom:7px solid transparent}
.arrow::before{content:'';position:absolute;left:-6px;top:-3px;width:8px;height:11px;background:#ef4444}
.hud{display:flex;gap:6px;padding:8px;justify-content:center;background:#0a0a1f}
.card{background:#1a1a2e;padding:7px 11px;border-radius:14px;text-align:center;min-width:80px}.card b{color:#ffd700;display:block}
.controls{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#0a0a1f;border-top:3px solid #ffd700;z-index:999;direction:ltr !important}
.btn{width:88px;height:88px;border-radius:50%;border:4px solid #fff;font-size:36px;color:#fff;display:flex;align-items:center;justify-content:center}
.btn:active{transform:scale(.92)} .left{background:#2563eb;order:1}.right{background:#2563eb;order:4}.jump{background:#f59e0b;width:100px;height:100px;order:2}.shoot{background:#dc2626;order:3}
.tabs{display:flex;gap:6px;padding:8px 12px;padding-bottom:120px}.tab{flex:1;background:#1a1a2e;padding:11px;border-radius:14px;text-align:center}.tab.on{border:2px solid #ffd700}
.big{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#000;padding:24px;border-radius:22px;border:3px solid #ffd700;text-align:center;display:none;z-index:1000;width:90%}
.big button{background:#ffd700;border:0;padding:12px 22px;border-radius:20px;font-weight:900;margin-top:10px}
.small{position:fixed;top:110px;left:50%;transform:translateX(-50%);background:#00c853;padding:10px 20px;border-radius:20px;font-weight:900;display:none;z-index:1000}
</style></head><body>
<div class="top"><div class="logo">🏇 فارس وحبيبته - 2026</div><div class="pill">💰 <span id="coins">0</span></div><button onclick="toggleMusic()" id="musicBtn" style="background:#00c853;border:0;width:52px;height:52px;border-radius:50%;font-size:22px">🎵</button></div>
<div class="bar"><span>المرحلة <b id="level">1</b>/10</span><span>💖 <b id="prog">0</b>%</span><span id="lives">❤️❤️❤️❤️❤️</span></div>
<div class="small" id="small"></div><div class="big" id="big"></div>
<div id="world">
  <div class="sun"></div><div class="cloud" style="left:20%;top:40px;width:80px;height:28px"></div><div class="cloud" style="left:60%;top:70px;width:70px;height:24px"></div>
  <div class="ground"></div>
  <div id="princess"><span class="heart">💖</span>👸<div class="name">حبيبتك 💖</div><div style="font-size:11px;color:#fff;background:#0008;border-radius:10px;padding:2px">ساعدني يا فارس!</div></div>
  <div id="knight">🏇</div>
</div>
<div class="hud"><div class="card">⭐ نقاط<b id="score">0</b></div><div class="card">🏹 سهام<b id="arrows">99</b></div><div class="card">👾 قتلت<b id="kills">0</b></div></div>
<div style="text-align:center;background:#0a0a1f;padding:6px;font-size:13px;color:#ffd700">▶ = الفارس بيركض لقدام &nbsp; 🐎 = نط &nbsp; 🏹 = سهم حقيقي</div>
<div class="tabs"><div class="tab on" onclick="showTab('help',this)">❓ كيف تلعب</div><div class="tab" onclick="showTab('shop',this)">🏹 سهام</div></div>
<div class="controls" dir="ltr"><button class="btn left" id="btnL">◀</button><button class="btn jump" id="btnJump">🐎</button><button class="btn shoot" id="btnShoot">🏹</button><button class="btn right" id="btnR">▶</button></div>
<script>
let level=1,score=0,coins=0,lives=5,kills=0,arrows=99;
let knightX=20,knightY=0,isJumping=false,dir=0,worldX=0,levelLen=1200+level*200,gameOver=false,lastHit=0;
let monsters=[],coinsArr=[],arrowsArr=[];
let worldEl=document.getElementById('world'),knightEl=document.getElementById('knight'),princessEl=document.getElementById('princess');
function showSmall(t,c){let m=document.getElementById('small');m.innerText=t;m.style.background=c||'#00c853';m.style.display='block';setTimeout(()=>m.style.display='none',1300)}
function showBig(h){document.getElementById('big').innerHTML=h;document.getElementById('big').style.display='block';gameOver=true}
function hideBig(){document.getElementById('big').style.display='none';gameOver=false}
function makeLevel(){
  worldX=0;knightX=20;dir=0;gameOver=false;
  document.querySelectorAll('.monster,.coin,.arrow').forEach(e=>e.remove());monsters=[];coinsArr=[];arrowsArr=[];
  // وحوش - واقفة وبتستناك، مش بتطير
  for(let i=0;i<3+level*2;i++){
    let d=document.createElement('div');d.className='monster';d.innerText=['👹','👺','👿','🧌'][i%4];worldEl.appendChild(d);
    monsters.push({el:d,wx:450+i*220+Math.random()*100,hp:2});
  }
  for(let i=0;i<7;i++){
    let d=document.createElement('div');d.className='coin';d.innerText='N';worldEl.appendChild(d);
    coinsArr.push({el:d,wx:300+i*180,y:120+Math.random()*80});
  }
  updateHUD();
}
function updateHUD(){
  document.getElementById('level').innerText=level;document.getElementById('coins').innerText=coins;document.getElementById('score').innerText=score;document.getElementById('arrows').innerText=arrows;document.getElementById('kills').innerText=kills;
  document.getElementById('lives').innerText='❤️'.repeat(lives)+'🖤'.repeat(5-lives);
  document.getElementById('prog').innerText=Math.min(100,Math.floor(knightX/levelLen*100));
}
// أصوات
let AC=null,musicOn=false,musicTimer=null;
function ac(){if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();return AC}
function tone(f,d,type='triangle',v=.1){try{let a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.01,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}}
function sGallop(){tone(170,.06,'square',.09);setTimeout(()=>tone(140,.06,'square',.09),110)}
function sJump(){tone(400,.15,'sine',.13);setTimeout(()=>tone(750,.18,'sine',.11),90)}
function sShoot(){tone(1000,.08,'sine',.11)}
function sCoin(){tone(1300,.1,'sine',.12);setTimeout(()=>tone(1650,.16,'sine',.11),70)}
function sHit(){tone(170,.45,'sawtooth',.18)}
function sWin(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.35,'triangle',.14),i*140))}
function sLose(){[400,250,120].forEach((f,i)=>setTimeout(()=>tone(f,.35,'sawtooth',.13),i*160))}
let mel=[523,659,784,1046,784,659],mi=0;
function toggleMusic(){musicOn=!musicOn;document.getElementById('musicBtn').innerText=musicOn?'🔇':'🎵';if(musicOn){ac().resume();musicTimer=setInterval(()=>{tone(mel[mi%mel.length],.28,'triangle',.07);mi++},300)}else clearInterval(musicTimer)}
// ===== الأزرار - بتشتغل 100% =====
function jump(){
  if(isJumping) return; isJumping=true; sJump();
  knightEl.classList.add('jump');
  setTimeout(()=>{knightEl.classList.remove('jump');isJumping=false},600);
}
function shoot(){
  if(arrows<=0){showSmall('خلصت السهام!','#ff4757');return} arrows--; sShoot(); updateHUD();
  let a=document.createElement('div');a.className='arrow';a.style.width='34px';a.style.left=knightX+80+'px';a.style.bottom=(68+45)+'px';worldEl.appendChild(a);
  let ax=knightX+80; arrowsArr.push({el:a,ax:ax});
}
function hold(btn,d){let s=e=>{e.preventDefault();dir=d;knightEl.classList.add('run')};let e2=e=>{e.preventDefault();dir=0;knightEl.classList.remove('run')};btn.addEventListener('touchstart',s,{passive:false});btn.addEventListener('touchend',e2);btn.addEventListener('mousedown',s);btn.addEventListener('mouseup',e2);btn.addEventListener('mouseleave',e2)}
hold(document.getElementById('btnL'),-1);hold(document.getElementById('btnR'),1);
let bJ=document.getElementById('btnJump'),bS=document.getElementById('btnShoot');
bJ.addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});bJ.addEventListener('click',jump);
bS.addEventListener('touchstart',e=>{e.preventDefault();shoot()},{passive:false});bS.addEventListener('click',shoot);
// لوحة مفاتيح للكمبيوتر
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight')dir=1;if(e.key=='ArrowLeft')dir=-1;if(e.key==' ')jump();if(e.key=='f')shoot()});
document.addEventListener('keyup',e=>{if(e.key=='ArrowRight'||e.key=='ArrowLeft')dir=0});
// ===== اللعبة - كل 30ms =====
setInterval(()=>{
  if(gameOver) return;
  // الفارس هو اللي بيمشي - مش حبيبته
  if(dir!=0){
    knightX+=dir*5; if(knightX<0)knightX=0; if(knightX>window.innerWidth-100)knightX=window.innerWidth-100;
    if(Math.random()<0.15) sGallop();
  }
  knightEl.style.left=knightX+'px';
  // حبيبته ثابتة بآخر المرحلة
  let princessX=levelLen - (knightX>400? knightX-400:0);
  // الكاميرا: العالم بيتحرك بس لما الفارس يوصل نص الشاشة
  let camX=Math.max(0,knightX-250);
  princessEl.style.left=(levelLen-camX)+'px';
  // وحوش
  monsters.forEach(m=>{
    let sx=m.wx-camX; m.el.style.left=sx+'px';
    // الوحش بيلاحقك ببطء بس اذا قربت منه
    if(Math.abs(m.wx-knightX)<220) m.wx+= (m.wx<knightX? 0.7:-0.7);
    if(Math.abs(m.wx-knightX)<45 && !isJumping && Date.now()-lastHit>1200){
      lives--;lastHit=Date.now();sHit();if(navigator.vibrate)navigator.vibrate(200);showSmall('😱 مسكك! بقي '+lives+' قلوب','#ff4757');updateHUD();
      if(lives<=0){sLose();showBig(`<h2>💔 الوحوش منعوك!</h2><p>خلصت الـ 5 قلوب</p><button onclick="restartAll()">🔄 ابدأ من المرحلة 1</button>`);}
    }
    if(isJumping && Math.abs(m.wx-knightX)<45){score+=5;updateHUD();}
  });
  // عملات
  coinsArr.forEach(c=>{let sx=c.wx-camX;c.el.style.left=sx+'px';c.el.style.bottom=(68+90+c.y*0.3)+'px';if(Math.abs(c.wx-knightX)<40 && !isJumping){coins++;score+=10;c.wx=knightX+600+Math.random()*200;sCoin();updateHUD();} if(isJumping && Math.abs(c.wx-knightX)<40){coins++;score+=10;c.wx=knightX+600+Math.random()*200;sCoin();updateHUD();}});
  // سهام - سهم حقيقي بيطير وبيصيد
  arrowsArr.forEach((a,i)=>{a.ax+=10;a.el.style.left=(a.ax-camX)+'px';let hit=false;monsters.forEach(m=>{if(Math.abs(a.ax-m.wx)<30){m.hp--;hit=true;if(m.hp<=0){score+=30;coins+=2;kills++;m.wx=knightX+700+Math.random()*200;m.hp=2;showSmall('🏹 صبته! +30');updateHUD();}}});if(hit||a.ax>knightX+500){a.el.remove();arrowsArr.splice(i,1)}});
  // وصلت لحبيبتك؟
  if(knightX>=levelLen-100){
    sWin();
    if(level>=10){showBig(`<h2>👑 خلصت كل الـ 10 مراحل!</h2><p style="font-size:48px">🏇💖👸</p><p>الفارس وصل لحبيبته!</p><p>⭐ ${score} | 💰 ${coins}</p><button onclick="restartAll()">🔄 العب من جديد</button>`);}
    else{showBig(`<h2>💖 وصلت لحبيبتك!</h2><p style="font-size:48px">🏇💖👸</p><p>المرحلة ${level} خلصت!</p><button onclick="nextLevel()">➡️ المرحلة ${level+1}</button>`);}
  }
},30);
function nextLevel(){hideBig();level++;score+=100;coins+=50;arrows+=20;levelLen=1200+level*200;makeLevel();}
function restartAll(){hideBig();level=1;score=0;coins=0;lives=5;kills=0;arrows=99;levelLen=1400;makeLevel();}
function showTab(t,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');let p=document.getElementById('panel');if(!p){let d=document.createElement('div');d.id='panel';d.style.cssText='margin:0 12px 12px;background:#111124;padding:12px;border-radius:16px';document.body.insertBefore(d,document.querySelector('.controls'));p=d}
if(t=='help')p.innerHTML=`<b>كيف تلعب؟</b><br>▶ الفارس بيركض لقدام<br>🐎 نط فوق الوحش<br>🏹 سهم حقيقي بيصيد<br>💖 اوصل للأميرة 👸 واقفة بآخر المرحلة<br>❤️ معك 5 قلوب`;
if(t=='shop')p.innerHTML=`<b>🏹 سهام</b><br>معك ${arrows} سهم | ${coins} عملة<br><button onclick="buyArrows()" style="background:#ffd700;border:0;padding:10px 18px;border-radius:20px;font-weight:900;margin-top:8px">اشتري 20 سهم - 30 🪙</button>`;}
function buyArrows(){if(coins>=30){coins-=30;arrows+=20;showSmall('تم! +20 سهم 🏹');updateHUD()}else showSmall('ما معك عملات!','#ff4757')}
makeLevel();
</script></body></html>
