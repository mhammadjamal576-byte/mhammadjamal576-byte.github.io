<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>NOVA V2 - تحفة</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#050510;color:#fff;font-family:Arial;overflow:hidden;height:100dvh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;padding:10px 12px;background:#0a0a1f;align-items:center}.logo{font-size:21px;font-weight:900;color:#a855f7}.logo span{color:#00f0ff}.pill{background:linear-gradient(#a855f7,#6d28d9);padding:7px 12px;border-radius:20px;font-weight:800}
.round-bar{display:flex;justify-content:space-between;padding:8px 14px;background:linear-gradient(90deg,#1a0a3e,#3b0764);font-weight:900}.round-bar b{color:#ffd700}
canvas{width:100%;flex:1;min-height:360px;display:block}
.hud{display:flex;gap:6px;padding:8px;justify-content:center;background:#0a0a1f;flex-wrap:wrap}
.card{background:#1a1a2e;border:1px solid #333;padding:7px 11px;border-radius:14px;text-align:center;min-width:76px}.card b{font-size:17px;color:#ffd700;display:block}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px calc(16px + env(safe-area-inset-bottom));background:#0a0a1f;direction:ltr !important}
.btn{width:82px;height:82px;border-radius:50%;border:3px solid rgba(255,255,255,.5);font-size:36px;color:#fff;touch-action:none;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.4)}
.btn:active{transform:translateY(4px) scale(.95);box-shadow:none}
.left{background:linear-gradient(#2563eb,#1d4ed8);order:1}.right{background:linear-gradient(#2563eb,#1d4ed8);order:4}.jump{background:linear-gradient(#a855f7,#7c3aed);width:94px;height:94px;order:2}.shoot{background:linear-gradient(#ef4444,#dc2626);order:3}.musicBtn{background:#00c853;width:52px;height:52px;font-size:20px}
.tabs{display:flex;gap:6px;padding:8px 12px}.tab{flex:1;background:#1a1a2e;padding:11px;border-radius:14px;text-align:center;border:2px solid transparent}.tab.on{border-color:#a855f7;background:#2a1a3e}
.panel{margin:0 12px 12px;background:#111124;padding:12px;border-radius:16px;max-height:16vh;overflow:auto}
.item{display:flex;justify-content:space-between;align-items:center;background:#1e1e35;padding:11px;border-radius:12px;margin:8px 0}.item button{background:#a855f7;color:#fff;border:0;padding:9px 15px;border-radius:20px;font-weight:700}
.bar{height:10px;background:#333;border-radius:10px;overflow:hidden;margin-top:6px}.bar div{height:100%;background:linear-gradient(90deg,#a855f7,#00f0ff)}
.combo{position:fixed;top:75px;left:50%;transform:translateX(-50%);background:linear-gradient(#ff0055,#ff6b00);padding:10px 22px;border-radius:25px;font-weight:900;display:none;z-index:30;box-shadow:0 0 20px #ff0055}
.msg{position:fixed;top:120px;left:50%;transform:translateX(-50%);background:#00c853;padding:11px 22px;border-radius:25px;font-weight:900;display:none;z-index:40}
</style></head><body>
<div class="top"><div class="logo">NOVA <span>V2 • تحفة</span></div><div class="pill">💰 <span id="coins">0</span></div><button class="musicBtn btn" id="musicBtn" onclick="toggleMusic()">🎵</button></div>
<div class="round-bar"><span>🏆 الجولة <b id="round">1</b></span><span>⏱ <b id="time">45</b> ث</span><span>🎯 <b id="goal">10</b> 🪙</span><span>👾 اقتل <b id="kills">0</b></span></div>
<div class="combo" id="combo">🔥 كومبو!</div><div class="msg" id="msg"></div>
<canvas id="game" width="400" height="400"></canvas>
<div class="hud"><div class="card">⭐ نقاط<b id="score">0</b></div><div class="card">❤️ صحة<b id="hp">100</b></div><div class="card">🔥 كومبو<b id="cb">0</b></div><div class="card">🪙 الجولة<b id="roundCoins">0</b></div></div>
<div style="padding:0 12px;background:#0a0a1f"><div style="display:flex;justify-content:space-between;font-size:12px"><span>⭐ تقدمك</span><span id="progTxt">0%</span></div><div class="bar"><div id="prog"></div></div><div id="mission" style="color:#00ff88;font-size:13px;padding:5px 0">🛡️ حماية 2 ثانية - استعد!</div></div>
<div class="controls" dir="ltr">
<button class="btn left" id="btnL">◀</button>
<button class="btn jump" id="btnJump">⬆</button>
<button class="btn shoot" id="btnShoot">💥</button>
<button class="btn right" id="btnR">▶</button>
</div>
<div class="tabs"><div class="tab on" onclick="showTab('shop',this)">🛒 متجر</div><div class="tab" onclick="showTab('upgrade',this)">⬆ ترقيات</div><div class="tab" onclick="showTab('pass',this)">🏆 Pass</div><div class="tab" onclick="showTab('daily',this)">🎁 يومي</div></div>
<div class="panel" id="panel"></div>
<script>
let cv=document.getElementById('game'),ctx=cv.getContext('2d');
let score=parseInt(localStorage.getItem('nova_score')||0),coins=parseInt(localStorage.getItem('nova_coins')||0),lvl=parseInt(localStorage.getItem('nova_lvl')||1);
let hp=100,combo=0,skin=localStorage.getItem('nova_skin')||'🚀',speed=5,round=1,roundCoins=0,kills=0,timeLeft=45,goal=10;
let px=70,py=0,vy=0,dir=0,groundY=320,face=1,invincible=true,lastHit=0,shake=0,particles=[],coinsArr=[],enemies=[],bullets=[],clouds=[];
py=groundY;
for(let i=0;i<5;i++) clouds.push({x:Math.random()*400,y:20+Math.random()*80,s:0.3+Math.random()*0.5});
function spawnCoin(){ return {x:200+Math.random()*180,y:190+Math.random()*90,t:Math.random()*10} }
for(let i=0;i<6;i++) coinsArr.push(spawnCoin());
function spawnEnemy(x){ return {x:x||430,y:groundY,dx:-(1.2+round*0.25),hp:2,color:['#ff2d55','#ff9500','#7d00ff','#00c853','#00f0ff'][Math.floor(Math.random()*5)],jumped:false} }
enemies.push(spawnEnemy(380),spawnEnemy(600),spawnEnemy(800));
setTimeout(()=>{invincible=false;document.getElementById('mission').innerText='🎯 انط فوق الوحش! اضرب اللي قدامك!'},2000);
function save(){localStorage.setItem('nova_score',score);localStorage.setItem('nova_coins',coins);localStorage.setItem('nova_lvl',lvl);localStorage.setItem('nova_skin',skin)}
function updateHUD(){document.getElementById('score').innerText=score;document.getElementById('coins').innerText=coins;document.getElementById('hp').innerText=hp;document.getElementById('cb').innerText=combo;document.getElementById('round').innerText=round;document.getElementById('time').innerText=timeLeft;document.getElementById('goal').innerText=goal;document.getElementById('roundCoins').innerText=roundCoins;document.getElementById('kills').innerText=kills;let p=Math.min(100,score%100);document.getElementById('prog').style.width=p+'%';document.getElementById('progTxt').innerText=p+'%'}
function showMsg(t,c){let m=document.getElementById('msg');m.innerText=t;m.style.background=c||'#00c853';m.style.display='block';setTimeout(()=>m.style.display='none',1600)}
function jump(){ if(py>=groundY-1){ vy=-17; playSfx(600); for(let i=0;i<6;i++) particles.push({x:px+15,y:groundY+30,vx:(Math.random()-0.5)*3,vy:-Math.random()*3,life:20,color:'#a855f7'}); } }
function shoot(){ // رصاصة أفقية - بتروح لقدام وتصيد
  bullets.push({x:px+30*face,y:py-15,vx:11*face}); playSfx(900); if(navigator.vibrate) navigator.vibrate(15); shake=2;
}
let btnL=document.getElementById('btnL'),btnR=document.getElementById('btnR'),btnJ=document.getElementById('btnJump'),btnS=document.getElementById('btnShoot');
function bindHold(btn,d){let s=e=>{e.preventDefault();dir=d;face=d;};let e2=e=>{e.preventDefault();dir=0};btn.addEventListener('touchstart',s,{passive:false});btn.addEventListener('touchend',e2);btn.addEventListener('mousedown',s);btn.addEventListener('mouseup',e2);btn.addEventListener('mouseleave',e2)}
bindHold(btnL,-1); bindHold(btnR,1);
btnJ.addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false}); btnJ.addEventListener('click',jump);
btnS.addEventListener('touchstart',e=>{e.preventDefault();shoot()},{passive:false}); btnS.addEventListener('click',shoot);
let startX=0;cv.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});cv.addEventListener('touchmove',e=>{let dx=e.touches[0].clientX-startX;if(dx>12){dir=1;face=1}else if(dx<-12){dir=-1;face=-1}else dir=0},{passive:true});cv.addEventListener('touchend',()=>dir=0);
let audioCtx=null,musicOn=false,musicTimer=null;
function getCtx(){if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();return audioCtx}
function playSfx(f){try{let a=getCtx(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=.08;o.start();o.stop(a.currentTime+.12)}catch(e){}}
function playNote(f,d){try{let a=getCtx(),o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.1,a.currentTime);g.gain.exponentialRampToValueAtTime(.01,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}}
let melody=[523,659,784,1046,784,659,523,659,784,880,1046,880,784,659,587,659],mi=0;
function toggleMusic(){musicOn=!musicOn;document.getElementById('musicBtn').innerText=musicOn?'🔇':'🎵';if(musicOn){getCtx().resume();musicTimer=setInterval(()=>{playNote(melody[mi%melody.length],.28);mi++},280)}else clearInterval(musicTimer)}
document.addEventListener('touchstart',()=>{if(!musicOn) toggleMusic()},{once:true});
setInterval(()=>{timeLeft--; if(timeLeft<=0){ if(roundCoins>=goal){round++;goal=10+round*5;roundCoins=0;kills=0;timeLeft=45;showMsg('🎉 الجولة '+round+' بدأت! أصعب وأمتع!');enemies=[spawnEnemy(400),spawnEnemy(600),spawnEnemy(800)];} else {showMsg('⏱ خلص الوقت! حاول مرة ثانية','#ff4757');roundCoins=0;timeLeft=45;hp=100;}} updateHUD();},1000);
function drawPlayer(){
  ctx.save(); ctx.translate(px+15,py); if(invincible && Math.floor(Date.now()/180)%2==0) ctx.globalAlpha=.45;
  // ظل
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.ellipse(0,32,22,6,0,0,Math.PI*2); ctx.fill();
  ctx.font='46px Arial'; ctx.shadowColor='#a855f7'; ctx.shadowBlur=18; ctx.fillText(skin, -22, 10);
  ctx.restore();
}
function drawMonster(e){
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.ellipse(0,32,24,6,0,0,Math.PI*2); ctx.fill();
  // أرجل تمشي
  let leg = Math.sin(Date.now()/120 + e.x)*6;
  ctx.fillStyle='#222'; ctx.fillRect(-14,18,7,14+leg*0.3); ctx.fillRect(7,18,7,14-leg*0.3);
  // قرون
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(-18,-18); ctx.lineTo(-10,-38); ctx.lineTo(-2,-18); ctx.fill(); ctx.beginPath(); ctx.moveTo(18,-18); ctx.lineTo(10,-38); ctx.lineTo(2,-18); ctx.fill();
  // جسم
  let grad=ctx.createLinearGradient(0,-25,0,25); grad.addColorStop(0,e.color); grad.addColorStop(1,'#1a0000');
  ctx.fillStyle=grad; ctx.beginPath(); ctx.ellipse(0,0,27,28,0,0,Math.PI*2); ctx.fill();
  // عيون غاضبة
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-10,-6,8,0,Math.PI*2); ctx.arc(10,-6,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(-10,-6,3.5,0,Math.PI*2); ctx.arc(10,-6,3.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='red'; ctx.beginPath(); ctx.arc(-10,-7,1.5,0,Math.PI*2); ctx.arc(10,-7,1.5,0,Math.PI*2); ctx.fill();
  // حواجب غاضبة
  ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-18,-16); ctx.lineTo(-4,-10); ctx.moveTo(18,-16); ctx.lineTo(4,-10); ctx.stroke();
  // فم
  ctx.fillStyle='#3a0000'; ctx.beginPath(); ctx.ellipse(0,13,14,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; [[-8,9],[0,11],[8,9]].forEach(p=>{ctx.fillRect(p[0]-2,p[1],4,5)});
  ctx.fillStyle='#333'; ctx.fillRect(-20,-48,40,6); ctx.fillStyle='#00ff00'; ctx.fillRect(-20,-48,40*e.hp/2,6);
  ctx.restore();
}
function drawCoin(c){
  ctx.save(); ctx.translate(c.x,c.y+Math.sin(c.t)*7);
  ctx.shadowColor='#ffd700'; ctx.shadowBlur=15;
  ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.ellipse(0,0,15,17,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffaa00'; ctx.beginPath(); ctx.ellipse(0,0,10,12,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 14px Arial'; ctx.textAlign='center'; ctx.fillText('N',0,5);
  ctx.restore();
}
function loop(){
  ctx.save(); if(shake>0){ctx.translate((Math.random()-0.5)*shake*2,(Math.random()-0.5)*shake*2); shake--;}
  // سماء متحركة
  let sky=ctx.createLinearGradient(0,0,0,400); sky.addColorStop(0,'#2a0a4a'); sky.addColorStop(0.6,'#1a0a2e'); sky.addColorStop(1,'#050510'); ctx.fillStyle=sky; ctx.fillRect(0,0,400,400);
  // نجوم
  ctx.fillStyle='#fff'; for(let i=0;i<20;i++){let sx=(i*67)%400, sy=(i*31)%180; ctx.globalAlpha=0.4+Math.sin(Date.now()/500+i)*0.3; ctx.fillRect(sx,sy,2,2);} ctx.globalAlpha=1;
  // غيوم
  clouds.forEach(c=>{c.x-=c.s; if(c.x<-60)c.x=430; ctx.fillStyle='rgba(255,255,255,.18)'; ctx.beginPath(); ctx.ellipse(c.x,c.y,30,12,0,0,Math.PI*2); ctx.ellipse(c.x+20,c.y+4,22,10,0,0,Math.PI*2); ctx.fill();});
  // أرضية احترافية
  ctx.fillStyle='#120a2e'; ctx.fillRect(0,groundY+30,400,70);
  ctx.fillStyle='#a855f7'; ctx.fillRect(0,groundY+30,400,4);
  ctx.fillStyle='#2a1a4e'; for(let i=0;i<9;i++) ctx.fillRect(i*50,groundY+38,30,6);
  ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(0,0,400,28); ctx.fillStyle='#fff'; ctx.font='bold 14px Arial'; ctx.fillText('🏆 جولة '+round+' | 🪙 '+roundCoins+'/'+goal+' | 👾 '+kills,12,20);
  // عملات - في قوس القفزة
  coinsArr.forEach(c=>{c.t+=.08; drawCoin(c);
    if(Math.abs((px+15)-c.x)<32 && Math.abs((py-10)-c.y)<34){coins++;score+=10;combo++;roundCoins++;Object.assign(c,spawnCoin());playSfx(1300); for(let i=0;i<8;i++) particles.push({x:c.x,y:c.y,vx:(Math.random()-0.5)*4,vy:-Math.random()*3,life:18,color:'#ffd700'}); if(combo>=4){document.getElementById('combo').style.display='block';document.getElementById('combo').innerText='🔥 كومبو x'+combo;setTimeout(()=>document.getElementById('combo').style.display='none',900);score+=15;}}});
  // وحوش - تمشي على الأرض
  enemies.forEach(e=>{
    e.x+=e.dx; if(e.x<-40){ Object.assign(e, spawnEnemy(430+Math.random()*200)); }
    drawMonster(e);
    // تلامس دقيق: بس اذا انت على الأرض وقريب منه
    let dx=Math.abs((px+15)-e.x), dy=Math.abs(py-e.y);
    if(!invincible && Date.now()-lastHit>900 && dx<30 && dy<32){
      // اذا نطيت فوقه - ما بتنضرب، بتاخد نقطة!
      if(py < groundY-60){ if(!e.jumped){e.jumped=true; score+=20; showMsg('🤸 نطيت فوق الوحش! +20'); playSfx(1500);} }
      else { hp-=12; lastHit=Date.now(); combo=0; shake=6; playSfx(200); if(navigator.vibrate) navigator.vibrate(100); if(hp<=0){hp=100; score=Math.max(0,score-20); showMsg('💪 رجعت أقوى! اهرب وانط فوقهم!','#ff4757'); invincible=true; setTimeout(()=>invincible=false,2000);} }
    }
  });
  // رصاص أفقي - يصيد اللي قدامك
  bullets.forEach((b,i)=>{ b.x+=b.vx; ctx.save(); ctx.translate(b.x,b.y); ctx.fillStyle='#ff6a00'; ctx.shadowColor='#ff6a00'; ctx.shadowBlur=12; ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#ffdd00'; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill(); ctx.restore();
    let hit=false; enemies.forEach(en=>{ if(Math.abs(b.x-en.x)<34 && Math.abs(b.y-(en.y-5))<32){ en.hp--; hit=true; shake=4; playSfx(300); for(let i=0;i<10;i++) particles.push({x:en.x,y:en.y,vx:(Math.random()-0.5)*5,vy:-Math.random()*4,life:16,color:'#ff6a00'}); if(en.hp<=0){ score+=30; coins+=2; kills++; Object.assign(en, spawnEnemy(430+Math.random()*150)); showMsg('💥 قتلت الوحش! +30'); } } });
    if(hit || b.x<-20 || b.x>420) bullets.splice(i,1);
  });
  particles.forEach((p,i)=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.life--; ctx.fillStyle=p.color; ctx.globalAlpha=p.life/20; ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; if(p.life<=0) particles.splice(i,1); });
  // حركة اللاعب - فيزياء صح
  px+=dir*speed; if(px<5)px=5; if(px>360)px=360; vy+=0.85; py+=vy; if(py>groundY){py=groundY;vy=0;}
  drawPlayer();
  if(score>=lvl*100){lvl++; showMsg('🎉 مستوى جديد! '+lvl);}
  ctx.restore(); updateHUD(); save(); requestAnimationFrame(loop);
} loop();
function showTab(t,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');let p=document.getElementById('panel');
if(t=='shop') p.innerHTML=`<h3>🛒 متجر</h3>${[['🚀',0,'صاروخ'],['🦄',50,'يونيكورن'],['🐉',120,'تنين'],['👑',200,'الملك'],['👽',300,'فضائي']].map(s=>`<div class="item"><span>${s[0]} ${s[2]}</span><button onclick="buySkin('${s[0]}',${s[1]})">${s[1]==0?'مجاني':s[1]+' 🪙'}</button></div>`).join('')}<p>معك ${coins} عملة</p>`;
if(t=='upgrade') p.innerHTML=`<h3>⬆ ترقيات</h3><div class="item"><span>🏃 سرعة</span><button onclick="buyUp('speed',40)">40 🪙</button></div><div class="item"><span>❤️ صحة +50</span><button onclick="buyUp('hp',25)">25 🪙</button></div>`;
if(t=='pass') p.innerHTML=`<h3>🏆 Battle Pass</h3><div class="item"><span>🎁 مستوى 1 - 50 عملة</span><button onclick="claimPass(1,50)">خذ</button></div><div class="item"><span>👑 مستوى 5 - سكن الملك</span><button onclick="claimPass(5,0)">خذ</button></div><p><button onclick="shareScore()">📤 شارك نتيجتك</button></p>`;
if(t=='daily') p.innerHTML=`<h3>🎁 مكافأة يومية</h3><button style="width:100%;padding:14px;background:#00c853;color:#fff;border:0;border-radius:12px;font-size:16px" onclick="daily()">خذ 100 عملة 🎁</button><p>🔥 سلسلة: ${localStorage.getItem('nova_streak')||1} أيام</p>`;}
function buySkin(s,c){if(coins>=c){coins-=c;skin=s;save();updateHUD();showMsg('تم! سكنك '+s);}else showMsg('ما معك عملات!','#ff4757')}
function buyUp(k,c){if(coins>=c){coins-=c;if(k=='speed')speed++;if(k=='hp')hp+=50;save();updateHUD();showMsg('تمت الترقية! 💪')}else showMsg('ما معك عملات!','#ff4757')}
function claimPass(l,r){if(lvl>=l){coins+=r;if(l==5)skin='👑';save();updateHUD();showMsg('مبروك! 🎉')}else showMsg('لسا ما وصلت المستوى '+l,'#ff4757')}
function daily(){let today=new Date().toDateString();if(localStorage.getItem('nova_last')==today){showMsg('أخذت هديتك اليوم!','#ff4757')}else{coins+=100;localStorage.setItem('nova_last',today);let st=parseInt(localStorage.getItem('nova_streak')||0)+1;localStorage.setItem('nova_streak',st);save();updateHUD();showMsg('مبروك! +100 عملة 🎉')}}
function shareScore(){let txt='انا جبت '+score+' نقطة بلعبة NOVA V2! '+location.href;if(navigator.share)navigator.share({text:txt});else{prompt('انسخ وشارك:',txt)}}
showTab('shop',document.querySelector('.tab'));updateHUD();
</script></body></html>
