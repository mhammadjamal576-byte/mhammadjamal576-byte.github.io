<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لعبة جمع الفلوس - تحدي الأصدقاء!</title>
<script>(function(s){s.dataset.zone='12159570',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<script>(function(s){s.dataset.zone='12159491',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#667eea,#764ba2);font-family:system-ui;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px;color:white}
#gameBox{background:white;border-radius:20px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);width:98%;max-width:400px}
#header{display:flex;justify-content:space-between;color:#333;font-weight:bold;font-size:15px;flex-wrap:wrap;gap:5px}
#canvas{background:linear-gradient(#87CEEB,#E0F6FF);border-radius:15px;display:block;width:100%;touch-action:none}
.btn{border:none;padding:12px;border-radius:25px;font-size:16px;font-weight:bold;cursor:pointer;width:100%;margin-top:8px}
#playBtn{background:#764ba2;color:white}
#shareBtn{background:#25D366;color:white;display:none}
#board{background:#f7f7ff;border-radius:12px;padding:8px;margin-top:8px;color:#333}
#board h3{font-size:13px;text-align:center;margin-bottom:4px}
#board ol{padding-right:20px;font-size:12px}
#msg{color:#555;text-align:center;margin-top:5px;font-size:12px}
.badge{display:inline-block;background:#ffeaa7;color:#333;padding:2px 7px;border-radius:10px;font-size:11px}
</style>
</head>
<body>
<div id="gameBox">
<div id="header"><span>💰 <b id="score">0</b> <span id="level" class="badge">مستوى 1</span></span><span>⏱️ <b id="timer">60</b>ث</span><span>👑 <b id="best">0</b></span></div>
<canvas id="canvas" width="360" height="400"></canvas>
<button id="playBtn" class="btn">إبدأ اللعب 🎮 60 ثانية!</button>
<button id="shareBtn" class="btn">شارك نتيجتك واتساب 📲</button>
<div id="msg">🟢=1 | 🔵=3 | 🟡=5 | 🟣=10 - تجنب 💣</div>
<div id="board"><h3>🏆 المتصدرين</h3><ol id="topList"><li>لا يوجد بعد</li></ol></div>
</div>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),levelEl=document.getElementById('level'),timerEl=document.getElementById('timer'),playBtn=document.getElementById('playBtn'),shareBtn=document.getElementById('shareBtn'),topList=document.getElementById('topList'),msg=document.getElementById('msg');
let score,best=parseInt(localStorage.getItem('best')||0),y,vy,player,coins,bombs,game,frame,timeLeft,timerInt,audioCtx;
bestEl.textContent=best;
let leaders=JSON.parse(localStorage.getItem('leaders')||'[]');
function renderLeaders(){if(leaders.length==0){topList.innerHTML='<li>لا يوجد بعد</li>';return}topList.innerHTML=leaders.slice(0,5).map((s,i)=>`<li>${s} نقطة ${i==0?'👑':''}</li>`).join('')}
renderLeaders();
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playSound(type){initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);if(type=='coin'){o.frequency.value=800+Math.random()*400;g.gain.value=0.15;o.type='sine';}if(type=='bigcoin'){o.frequency.value=1200;g.gain.value=0.25;o.type='triangle';}if(type=='bomb'){o.frequency.value=150;g.gain.value=0.3;o.type='sawtooth';}o.start();g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.3);o.stop(audioCtx.currentTime+0.3);}
function reset(){score=0;frame=0;timeLeft=60;y=200;vy=0;player={x:70,y:200,w:30,h:30};coins=[];bombs=[];scoreEl.textContent=0;timerEl.textContent=60;levelEl.textContent='مستوى 1';shareBtn.style.display='none';}
function spawn(){let coinRate=Math.max(35,80-score);if(frame%coinRate===0){let r=Math.random(),type,points;if(r<0.5){type='green';points=1;}else if(r<0.8){type='blue';points=3;}else if(r<0.95){type='yellow';points=5;}else{type='purple';points=10;}coins.push({x:360,y:Math.random()*300+40,w:26,h:26,type,points});}if(frame%120===0){bombs.push({x:360,y:Math.random()*300+40,w:28,h:28});}}
function loop(){if(!game)return;frame++;ctx.clearRect(0,0,c.width,c.height);vy+=0.45;y+=vy;player.y=y;let speed=3+score*0.07;let level=Math.floor(score/10)+1;levelEl.textContent=`مستوى ${level}`;spawn();ctx.font='30px Arial';ctx.fillText('🦅',player.x-5,player.y+25);coins.forEach((co,i)=>{co.x-=speed;if(co.type=='green')ctx.fillText('💚',co.x,co.y);else if(co.type=='blue')ctx.fillText('💙',co.x,co.y);else if(co.type=='yellow')ctx.fillText('💛',co.x,co.y);else ctx.fillText('💜',co.x,co.y);if(co.x<player.x+player.w&&co.x+co.w>player.x&&co.y<player.y+player.h&&co.y+co.h>player.y){score+=co.points;scoreEl.textContent=score;if(co.points>=5)playSound('bigcoin');else playSound('coin');coins.splice(i,1);if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('best',best);}}if(co.x<-30)coins.splice(i,1);});bombs.forEach((b,i)=>{b.x-=speed+0.5;ctx.fillText('💣',b.x,b.y);if(b.x<player.x+player.w&&b.x+b.w>player.x&&b.y<player.y+player.h&&b.y+b.h>player.y){playSound('bomb');endGame();}if(b.x<-30)bombs.splice(i,1);});if(y>370||y<0){playSound('bomb');endGame();}requestAnimationFrame(loop);}
function endGame(){game=false;clearInterval(timerInt);playBtn.style.display='block';playBtn.textContent=`انتهى! جبت ${score} - العب تاني 🔄`;msg.textContent=score>=30?'🔥 أسطورة!':'حاول تكسر رقمك!';leaders.push(score);leaders.sort((a,b)=>b-a);leaders=leaders.slice(0,10);localStorage.setItem('leaders',JSON.stringify(leaders));renderLeaders();if(score>0){shareBtn.style.display='block';shareBtn.dataset.score=score;}}
function startTimer(){timerInt=setInterval(()=>{timeLeft--;timerEl.textContent=timeLeft;if(timeLeft<=0)endGame();},1000);}
function jump(){initAudio();if(!game){reset();game=true;playBtn.style.display='none';msg.textContent='يلا اجمع!';startTimer();loop();}vy=-7.5;}
c.addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});
c.addEventListener('mousedown',jump);
playBtn.addEventListener('click',jump);
shareBtn.addEventListener('click',()=>{let s=shareBtn.dataset.score;let text=`🎮 جبت ${s} نقطة في 60 ثانية! 💰\n🟢=1 🔵=3 🟡=5 🟣=10\nبتقدر تتحداني؟\nhttps://mhammadjamal576-byte.github.io`;window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank');});
reset();renderLeaders();
</script>
</body>
</html>
