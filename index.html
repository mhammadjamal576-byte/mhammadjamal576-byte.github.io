<div id="gameBox">

<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),levelEl=document.getElementById('level'),timerEl=document.getElementById('timer'),playBtn=document.getElementById('playBtn'),shareBtn=document.getElementById('shareBtn'),topList=document.getElementById('topList'),msg=document.getElementById('msg');

}

if(frame%coinRate===0){
let r=Math.random();
let type,points,color;
if(r<0.5){type='🟢';points=1;color='#2ecc71';}
else if(r<0.8){type='🔵';points=3;color='#3498db';}
else if(r<0.95){type='🟡';points=5;color='#f1c40f';}
else{type='🟣';points=10;color='#9b59b6';}
coins.push({x:360,y:Math.random()*300+40,w:26,h:26,type,points,color});
}
if(frame%120===0){bombs.push({x:360,y:Math.random()*300+40,w:28,h:28});}
}
function loop(){
if(!game)return;frame++;ctx.clearRect(0,0,c.width,c.height);

let speed=3+score*0.07;

if(co.x<player.x+player.w&&co.x+co.w>player.x&&co.y<player.y+player.h&&co.y+co.h>player.y){
score+=co.points;scoreEl.textContent=score;
if(co.points>=5)playSound('bigcoin');else playSound('coin');
ctx.fillStyle=co.color;ctx.font='bold 20px Arial';ctx.fillText(`+${co.points}`,co.x,co.y-10);
coins.splice(i,1);
if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('best',best);}
}
if(co.x<-30)coins.splice(i,1);
});
bombs.forEach((b,i)=>{
b.x-=speed+0.5;ctx.fillText('💣',b.x,b.y);
if(b.x<player.x+player.w&&b.x+b.w>player.x&&b.y<player.y+player.h&&b.y+b.h>player.y){playSound('bomb');endGame();}
if(b.x<-30)bombs.splice(i,1);
});
if(y>370||y<0){playSound('bomb');endGame();}
requestAnimationFrame(loop);
}
