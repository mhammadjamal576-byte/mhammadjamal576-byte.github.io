<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Collect Money Challenge / تحدي جمع الفلوس</title>
<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#070510;color:white;text-align:center;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#top{padding:10px;display:flex;justify-content:space-between;align-items:center;background:#1a1033;border-bottom:2px solid #facc15}
#game{position:relative;width:100vw;height:76vh;background:radial-gradient(circle at 50% 0%, #2a1a5e 0%, #070510 65%);overflow:hidden;touch-action:none}
.coin,.bomb{position:absolute;font-size:44px;cursor:pointer;user-select:none;touch-action:manipulation;z-index:2;line-height:1;
/* الحل 1: منطقة كبس كبيرة - حتى لو كبس جنب الفلوس بتنحسب */
padding:22px;margin:-22px;min-width:70px;min-height:70px;display:flex;align-items:center;justify-content:center;
filter:drop-shadow(0 0 12px gold);will-change:transform,top}
.bomb{filter:drop-shadow(0 0 12px red)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(0)}}
#timer{font-weight:bold;background:#facc15;padding:6px 12px;border-radius:20px;color:black;font-size:16px;box-shadow:0 0 15px #facc15}
#score{font-size:17px;font-weight:bold;color:#fde68a}
button.lang{background:#facc15;border:none;padding:8px 16px;border-radius:20px;font-weight:900;cursor:pointer;color:#111;touch-action:manipulation}
#soundBtn{background:#27272a;border:1px solid #444;color:white;padding:8px 10px;border-radius:50%;cursor:pointer;font-size:16px}
#centerMsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,5,30,0.95);padding:22px;border-radius:18px;display:none;z-index:10;width:86%;border:2px solid #facc15;box-shadow:0 0 30px rgba(250,204,21,.5)}
#startScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(7,5,16,0.9);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;box-sizing:border-box}
.bigBtn{padding:16px 24px;border-radius:14px;border:none;background:#22c55e;font-weight:900;font-size:20px;cursor:pointer;width:100%;max-width:280px;margin-top:10px;touch-action:manipulation;color:white;box-shadow:0 0 20px rgba(34,197,94,.5)}
.adBox{background:#111827;border:1px dashed #444;padding:8px;font-size:12px;color:#9ca3af}
</style>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="12159570" async data-cfasync="false"></script>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="12159491" async data-cfasync="false"></script>
</head>
<body>
<div id="top">
<div id="score">النقاط: 0 | Score: 0</div>
<div style="display:flex;gap:6px;align-items:center">
<button id="soundBtn" onclick="toggleSound()">🔊</button>
<button class="lang" onclick="toggleLang()">EN / AR</button>
</div>
<div id="timer">60s</div>
</div>
<div id="game">
<div id="startScreen">
<div style="font-size:60px">💰💎💣</div>
<h2 style="margin:0;color:#facc15">تحدي جمع الفلوس</h2>
<p style="margin:0;color:#ddd;font-size:15px">اكبس الفلوس 💰 لا تكبس القنبلة 💣<br>كومبو x3 = +5 بونص!</p>
<button class="bigBtn" onclick="startGame()">▶️ ابدأ اللعب / PLAY</button>
<p style="font-size:12px;color:#999">عندك 60 ثانية، ورجينا كم بتجيب؟</p>
</div>
<div id="centerMsg"></div>
</div>
<div id="info" style="padding:8px;font-size:14px;background:#0f0a2e">
<span class="ar">اضغط الفلوس 💰 لا تكبس القنبلة 💣 | كومبو x3 = +5 بونص!</span>
<span class="en" style="display:none">Tap money 💰 DON'T tap bomb 💣 | Combo x3 = +5 bonus!</span>
</div>
<div class="adBox">🎮 AD - PLAY & WIN - AD</div>
<script>
let score=0, time=60, lang='ar', soundOn=true, combo=0, lastTap=0;
let game=document.getElementById('game');
let scoreEl=document.getElementById('score');
let timerEl=document.getElementById('timer');
let audioCtx=null;
let gameStarted=false;
let spawnTimer=null;
let gameTimer=null;
let lastLane=-1;

function getAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function beep(freq,dur,type='sine',vol=0.2){ if(!soundOn) return; try{ let ctx=getAudio(); let o=ctx.createOscillator(); let g=ctx.createGain(); o.type=type; o.frequency.value=freq; g.gain.value=vol; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur); }catch(e){} }
function playCoin(){ beep(900,0.08,'sine',0.25); setTimeout(()=>beep(1400,0.12,'sine',0.25),60); }
function playBomb(){ beep(150,0.4,'sawtooth',0.4); }
function playClick(){ beep(600,0.05,'square',0.1); }
function playEnd(){ beep(500,0.15,'sine',0.3); setTimeout(()=>beep(700,0.15,'sine',0.3),150); setTimeout(()=>beep(1000,0.3,'sine',0.3),300); }
function playTick(){ beep(1200,0.05,'square',0.15); }
function toggleSound(){ soundOn=!soundOn; document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇'; if(soundOn) playClick(); }
function toggleLang(){ playClick(); if(lang==='ar'){ lang='en'; document.documentElement.dir='ltr'; document.querySelector('.ar').style.display='none'; document.querySelector('.en').style.display='inline'; } else { lang='ar'; document.documentElement.dir='rtl'; document.querySelector('.ar').style.display='inline'; document.querySelector('.en').style.display='none'; } updateScore(); }
function updateScore(){ scoreEl.textContent = lang==='ar' ? `النقاط: ${score} | Score: ${score}` : `Score: ${score} | النقاط: ${score}`; }

function startGame(){
  playClick();
  document.getElementById('startScreen').style.display='none';
  document.getElementById('centerMsg').style.display='none';
  score=0; time=60; combo=0; gameStarted=true;
  updateScore(); timerEl.textContent='60s'; timerEl.style.background='#facc15'; timerEl.style.color='black';
  // نزل 3 قطع بالبداية ببطء عشان اللاعب يفهم
  for(let i=0;i<3;i++) setTimeout(spawnItem,i*400);
  spawnTimer=setInterval(()=>{ if(gameStarted && Math.random()>0.10) spawnItem(); },450);
  gameTimer=setInterval(()=>{
    time--; timerEl.textContent=time+'s';
    if(time<=5 && time>0){ playTick(); timerEl.style.background='#ef4444'; timerEl.style.color='white'; }
    if(time<=0){ clearInterval(gameTimer); clearInterval(spawnTimer); gameStarted=false; playEnd(); showEnd(); }
  },1000);
}

function spawnItem(){
  if(!gameStarted) return;
  let isBomb = Math.random() < 0.18;
  let el=document.createElement('div');
  el.className=isBomb?'bomb':'coin';
  el.textContent=isBomb?'💣':['💰','💵','💲','🪙','💎'][Math.floor(Math.random()*5)];

  // الحل 2: مسارات ثابتة + ما بتتكرر نفس المسار مرتين، عشان ما يجوا فوق بعض
  let lane = Math.floor(Math.random()*6);
  if(lane===lastLane) lane=(lane+1)%6;
  lastLane=lane;
  el.style.left=(lane*14+2)+'vw';
  el.style.top='-70px';

  // الحل 3: نزول ناعم وبطيء بالبداية، وبصير أسرع مع الوقت - ما بيختفي فجأة
  let speed = 4200 + Math.random()*1200;
  if(time>45) speed=4800; // أول 15 ثانية أبطأ
  let startTime=null;
  function fall(ts){
    if(!startTime) startTime=ts;
    let p=(ts-startTime)/speed;
    if(p>=1){ el.remove(); return; }
    if(el.parentNode){ // اذا انكبس بنوقف
      el.style.top=(-70 + p*95)+'vh';
      requestAnimationFrame(fall);
    }
  }
  requestAnimationFrame(fall);

  // الحل 1: pointerdown بس، بدون touchstart - هيك الكبسة بتشتغل 100%
  let handled=false;
  el.addEventListener('pointerdown', function(e){
    if(handled) return; handled=true;
    e.preventDefault(); e.stopPropagation();
    if(isBomb){ score=Math.max(0,score-10); combo=0; playBomb(); el.textContent='💥'; el.style.transform='scale(1.5)'; setTimeout(()=>el.remove(),200); }
    else {
      let now=Date.now();
      if(now-lastTap<800) combo++; else combo=1; lastTap=now;
      let add = combo>=3 ? 5 : (Math.random()>0.85?5:1);
      score+=add; playCoin();
      el.style.transform='scale(1.5)'; el.style.opacity='0';
      setTimeout(()=>el.remove(),120);
    }
    updateScore();
  }, {passive:false});

  game.appendChild(el);
}

function showEnd(){
  let msg=document.getElementById('centerMsg');
  msg.style.display='block';
  if(lang==='ar'){ msg.innerHTML=`<h2 style="color:#facc15">انتهى الوقت! ⏰</h2><p style="font-size:20px">جبت <b>${score}</b> نقطة</p><p style="font-size:13px;color:#aaa">جارٍ تحميل نتيجتك... لا تسكر الصفحة</p><div class="adBox" style="margin:12px 0">🔥 إعلان - جاري التحميل...</div><p id="countdown">العب مرة ثانية بعد 3...</p>`; }
  else { msg.innerHTML=`<h2 style="color:#facc15">Time's Up! ⏰</h2><p style="font-size:20px">You got <b>${score}</b> points</p><p style="font-size:13px;color:#aaa">Loading your result... don't close</p><div class="adBox" style="margin:12px 0">🔥 AD - Loading...</div><p id="countdown">Play again in 3...</p>`; }
  let c=3; let cd=setInterval(()=>{ c--; let el=document.getElementById('countdown'); if(el) el.textContent = lang==='ar' ? `العب مرة ثانية بعد ${c}...` : `Play again in ${c}...`; if(c<=0){ clearInterval(cd); msg.innerHTML += `<button class="bigBtn" onclick="location.reload()">${lang==='ar'?'العب مرة ثانية 🔁 / Play Again':'Play Again 🔁 / العب مرة ثانية'}</button><p style="font-size:12px;margin-top:10px">${lang==='ar'?'تحدى أصحابك! ابعت الرابط':'Challenge friends! Share link'}</p>`; } },1000);
}
</script>
</body>
</html>
