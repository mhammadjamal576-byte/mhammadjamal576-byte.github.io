<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collect Money Challenge / تحدي جمع الفلوس</title>
<style>
  body { margin:0; font-family: sans-serif; background:#0f172a; color:white; text-align:center; overflow:hidden; }
  #top { padding:10px; display:flex; justify-content:space-between; align-items:center; background:#1e293b; }
  #game { position:relative; width:100vw; height:80vh; background:linear-gradient(#38bdf8,#0f172a); overflow:hidden; }
  .coin { position:absolute; font-size:30px; cursor:pointer; animation: fall linear; user-select:none; }
  @keyframes fall { from { top:-50px } to { top:85vh } }
  #timer { font-weight:bold; background:#22c55e; padding:5px 10px; border-radius:10px; color:black; }
  #score { font-size:18px; font-weight:bold; }
  button.lang { background:#22c55e; border:none; padding:8px 14px; border-radius:20px; font-weight:bold; cursor:pointer; }
  #centerMsg { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.85); padding:20px; border-radius:15px; display:none; z-index:10; width:80%; }
</style>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="12159570" async data-cfasync="false"></script>
<script src="https://alwingulla.com/88/tag.min.js" data-zone="12159491" async data-cfasync="false"></script>
</head>
<body>
<div id="top">
  <div id="score">النقاط: 0 | Score: 0</div>
  <button class="lang" onclick="toggleLang()">EN / AR</button>
  <div id="timer">60s</div>
</div>
<div id="game">
  <div id="centerMsg"></div>
</div>
<div id="info" style="padding:8px; font-size:14px;">
  <span class="ar">اضغط على الفلوس 💰 لجمعها!</span>
  <span class="en" style="display:none">Tap the money 💰 to collect!</span>
</div>

<script>
let score=0;
let time=60;
let lang='ar';
let game=document.getElementById('game');
let scoreEl=document.getElementById('score');
let timerEl=document.getElementById('timer');
let infoAr=document.querySelector('.ar');
let infoEn=document.querySelector('.en');

function toggleLang(){
  if(lang==='ar'){
    lang='en';
    document.documentElement.dir='ltr';
    infoAr.style.display='none';
    infoEn.style.display='inline';
  } else {
    lang='ar';
    document.documentElement.dir='rtl';
    infoAr.style.display='inline';
    infoEn.style.display='none';
  }
  updateScore();
}
function updateScore(){
  if(lang==='ar') scoreEl.textContent=`النقاط: ${score} | Score: ${score}`;
  else scoreEl.textContent=`Score: ${score} | النقاط: ${score}`;
}
function spawnCoin(){
  let coin=document.createElement('div');
  coin.className='coin';
  coin.textContent=['💰','💵','💲','🪙'][Math.floor(Math.random()*4)];
  coin.style.left=Math.random()*85+'vw';
  coin.style.animationDuration=(2+Math.random()*2.5)+'s';
  coin.onclick=()=>{
    score+= (Math.random()>0.85?5:1);
    updateScore();
    coin.remove();
  };
  game.appendChild(coin);
  setTimeout(()=>coin.remove(),5000);
}
setInterval(()=>{ if(Math.random()>0.2) spawnCoin(); },350);
let interval=setInterval(()=>{
  time--;
  timerEl.textContent=time+'s';
  if(time<=0){
    clearInterval(interval);
    let msg=document.getElementById('centerMsg');
    msg.style.display='block';
    if(lang==='ar'){
      msg.innerHTML=`<h2>انتهى الوقت! ⏰</h2><p>جبت ${score} نقطة</p><p>تقدر تجيب 100؟ تحدى أصحابك!</p><button onclick="location.reload()" style="padding:10px 20px; border-radius:10px; border:none; background:#22c55e; font-weight:bold;">العب مرة ثانية / Play Again</button>`;
    } else {
      msg.innerHTML=`<h2>Time's Up! ⏰</h2><p>You got ${score} points</p><p>Can you beat 100? Challenge friends!</p><button onclick="location.reload()" style="padding:10px 20px; border-radius:10px; border:none; background:#22c55e; font-weight:bold;">Play Again / العب مرة ثانية</button>`;
    }
  }
},1000);
for(let i=0;i<5;i++) setTimeout(spawnCoin, i*200);
</script>
</body>
</html>
