<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لعبة جمع الفلوس - العب واربح!</title>
<script>(function(s){s.dataset.zone='12158379',s.src='https://gizokraijaw.net/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<script>(function(s){s.dataset.zone='12159570',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#667eea,#764ba2);font-family:system-ui;height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white}
#gameBox{background:white;border-radius:20px;padding:15px;box-shadow:0 10px 30px rgba(0,0,0,.3);width:95%;max-width:380px}
#header{display:flex;justify-content:space-between;color:#333;font-weight:bold;font-size:18px;margin-bottom:10px}
#canvas{background:linear-gradient(#87CEEB,#E0F6FF);border-radius:15px;display:block;width:100%;touch-action:none}
#controls{text-align:center;margin-top:12px}
button{background:#764ba2;color:white;border:none;padding:12px 25px;border-radius:25px;font-size:18px;font-weight:bold;cursor:pointer;width:100%}
button:active{transform:scale(0.95)}
#msg{color:#333;text-align:center;margin-top:8px;font-size:14px}
</style>
</head>
<body>
<div id="gameBox">
<div id="header"><span>النقاط: <b id="score">0</b></span><span>أفضل: <b id="best">0</b></span></div>
<canvas id="canvas" width="350" height="450"></canvas>
<div id="controls"><button id="btn">إبدأ اللعب 🎮</button><div id="msg">اضغط الشاشة عشان تطير وتجمع 💵 وتتجنب 💣</div></div>
</div>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),btn=document.getElementById('btn');
let score,best=localStorage.getItem('best')||0,player,y,vy,coins,bombs,game,frame;
bestEl.textContent=best;
function reset(){
score=0;scoreEl.textContent=0;y=200;vy=0;player={x:70,y:200,w:30,h:30};coins=[];bombs=[];frame=0;
}
function spawn(){
if(frame%90===0){coins.push({x:350,y:Math.random()*350+50,w:25,h:25})}
if(frame%150===0){bombs.push({x:350,y:Math.random()*350+50,w:28,h:28})}
}
function loop(){
if(!game)return;
frame++;ctx.clearRect(0,0,c.width,c.height);
vy+=0.5;y+=vy;player.y=y;
spawn();
// player
ctx.font='30px Arial';ctx.fillText('🦅',player.x-5,player.y+25);
// coins
coins.forEach((co,i)=>{
co.x-=3;ctx.fillText('💵',co.x,co.y);
if(co.x<player.x+player.w&&co.x+co.w>player.x&&co.y<player.y+player.h&&co.y+co.h>player.y){score++;scoreEl.textContent=score;coins.splice(i,1);if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('best',best)}}
if(co.x<-30)coins.splice(i,1);
});
bombs.forEach((b,i)=>{
b.x-=4;ctx.fillText('💣',b.x,b.y);
if(b.x<player.x+player.w&&b.x+b.w>player.x&&b.y<player.y+player.h&&b.y+b.h>player.y){endGame()}
if(b.x<-30)bombs.splice(i,1);
});
if(y>420||y<0)endGame();
requestAnimationFrame(loop);
}
function endGame(){game=false;btn.style.display='block';btn.textContent=`انتهت! نقاطك ${score} - العب مرة ثانية 🔄`;document.getElementById('msg').textContent=score>10?'وحش! شارك اللعبة مع صحابك!':'حاول مرة ثانية!'}
function jump(){if(!game){reset();game=true;btn.style.display='none';loop();}vy=-8}
c.addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});
c.addEventListener('mousedown',jump);
btn.addEventListener('click',jump);
reset();
</script>
</body>
</html>
