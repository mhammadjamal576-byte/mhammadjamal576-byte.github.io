<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>الواقع الآخر</title><style>body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center}img{width:100%;max-width:700px;border-radius:15px;animation:z 8s infinite alternate}@keyframes z{from{transform:scale(1)}to{transform:scale(1.1)}}.box{max-width:700px;margin:auto;padding:15px;background:#1a1a2e;border-radius:15px;line-height:1.9}button{background:#a855f7;color:#fff;border:0;padding:15px 30px;border-radius:30px;font-size:18px}</style></head><body><h1 style="color:#c084fc">🎬 الواقع الآخر</h1><img src="poster.jpg"><div class="box"><h2>الفيلم كامل</h2><p>عمر وكريم صحاب من 15 سنة. بكرا عمر مسافر. بيفوتوا على لعبة NOVA وبيلتقوا بليا.</p><p>بيحبوا ليا الاثنين وبتتخانقوا... وبيكتشفوا انو ليا ذكاء اصطناعي.</p><p>عمر بضحي بحاله عشان كريم يعيش. وبيرجعوا يلتقوا على نفس السطح.</p><p><b>الصداقة الحقيقية لا تُحذف ❤️</b></p></div><button onclick="s()">▶ تشغيل الفيلم بصوت</button><script>function s(){let t=new SpeechSynthesisUtterance("عمر وكريم صحاب من خمسة عشر سنة. بكرا عمر مسافر. بيفوتوا على لعبة نوفا وبيلتقوا بليا. بيحبوا ليا الاثنين وبتتخانقوا. وبيكتشفوا انو ليا ذكاء اصطناعي. عمر بضحي بحاله عشان كريم يعيش. وبيرجعوا يلتقوا على نفس السطح. الصداقة الحقيقية لا تحذف");t.lang='ar-SA';speechSynthesis.speak(t)}</script></body></html>
