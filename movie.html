<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>الواقع الآخر - مشهد فيديو</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center}
.video{position:relative;width:100%;max-width:750px;margin:auto;overflow:hidden;border-radius:15px;aspect-ratio:9/16;max-height:85vh}
.video img{width:100%;height:100%;object-fit:cover;animation:zoom 20s infinite alternate}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.15)}}
.rain{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 8px,rgba(255,255,255,.25) 8px 9px);animation:rain .3s linear infinite}
@keyframes rain{from{background-position:0 0}to{background-position:-20px 30px}}
.vignette{position:absolute;inset:0;background:linear-gradient(transparent 60%,rgba(0,0,0,.9))}
.sub{position:absolute;bottom:20px;left:15px;right:15px;background:rgba(0,0,0,.7);padding:14px;border-radius:12px;font-size:18px;line-height:1.7}
button{background:#a855f7;color:#fff;border:0;padding:14px 28px;border-radius:30px;font-size:18px;margin:15px;cursor:pointer}
</style></head>
<body>
<h2 style="color:#c084fc">🎬 الواقع الآخر - المشهد الأول</h2>
<div class="video">
<img src="poster.jpg">
<div class="rain"></div><div class="vignette"></div>
<div class="sub" id="sub">اضغط تشغيل...</div>
</div>
<button onclick="play()">▶ تشغيل الفيلم مع الصوت</button>
<a href="https://mhammadjamal576-byte.github.io" style="color:#fff">🎮 العب اللعبة</a>
<script>
let lines=["ليا: أهلا فيكم بعالمي... هون ما في فراق","عمر: بكرا ببعد... بس صداقتنا ما بتخلص","كريم: ليش حاسس انو هاد العالم مش حقيقي؟","النظام: تم اختراق الصداقة بنجاح...","الصداقة الحقيقية... لا تُحذف ❤️"];
let i=0;
function play(){
let u=new SpeechSynthesisUtterance(lines.join(". "));u.lang='ar-SA';u.rate=0.9;speechSynthesis.speak(u);
let timer=setInterval(()=>{document.getElementById('sub').innerText=lines[i];i++;if(i>=lines.length)clearInterval(timer)},4000);
document.getElementById('sub').innerText=lines[0];
}
</script>
</body></html>
